<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6-sinf Tabiiy fanlar — Barcha mavzular</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f8ff}
body{display:flex;flex-direction:column}
#bar{display:flex;gap:6px;padding:8px;background:#fff;box-shadow:0 2px 8px #0002;overflow-x:auto;flex:0 0 auto;z-index:5}
#bar button{flex:0 0 auto;border:0;border-radius:20px;padding:9px 16px;background:#e8f0fb;color:#17324d;font:inherit;font-weight:700;font-size:.92rem;cursor:pointer;white-space:nowrap}
#bar button:hover{background:#ffe08a}
#bar button.on{background:#2563eb;color:#fff}
#stage{flex:1 1 auto;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
iframe.on{display:block}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<script>
const PAGES=[{"icon": "🍽️", "title": "Ovqat hazm qilish", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>6-sinf Tabiiy fanlar — Ovqat hazm qilish sistemasi<\/title>\n<style>\n:root{\n  --bg:#f4f8ff; --card:#fff; --text:#17324d; --muted:#60758a;\n  --blue:#367cf5; --green:#19a974; --orange:#ff9f43; --pink:#ee5aa6;\n  --red:#ef5350; --shadow:0 12px 35px rgba(35,72,120,.12);\n}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef6ff,#fff8f0);color:var(--text)}\nbutton{font:inherit}\n.app{max-width:1180px;margin:auto;padding:18px}\nheader{background:linear-gradient(135deg,#326bea,#6d5dfc);color:white;border-radius:26px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}\nheader:after{content:\"🫀  🍎  🥕  🥛\";position:absolute;right:25px;bottom:12px;font-size:42px;opacity:.16;letter-spacing:10px}\nh1{margin:0 0 8px;font-size:clamp(25px,4vw,42px)}\n.subtitle{margin:0;opacity:.9}\n.progress{display:flex;gap:7px;margin-top:20px;position:relative;z-index:2}\n.step{flex:1;text-align:center;padding:10px 5px;border-radius:14px;background:rgba(255,255,255,.2);font-weight:700;font-size:14px;transition:.3s}\n.step.active{background:white;color:#315fd1;transform:translateY(-2px)}\n.step.done{background:#bff3d5;color:#17653d}\nmain{margin-top:18px}\n.section{display:none;animation:fade .45s ease}\n.section.active{display:block}\n@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n.panel{background:var(--card);border-radius:24px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}\n.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.section-title h2{margin:0;font-size:28px}\n.badge{background:#eaf1ff;color:#315fd1;padding:8px 13px;border-radius:999px;font-weight:700}\n.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}\n.btn{border:0;border-radius:14px;padding:12px 18px;cursor:pointer;font-weight:700;transition:.2s;box-shadow:0 5px 14px rgba(0,0,0,.08)}\n.btn:hover{transform:translateY(-2px)}\n.btn.primary{background:var(--blue);color:white}.btn.green{background:var(--green);color:white}\n.btn.orange{background:var(--orange);color:#382000}.btn.pink{background:var(--pink);color:white}\n.btn.gray{background:#edf2f7;color:#34495e}\n.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}\n.info{background:#f1f7ff;border-left:5px solid var(--blue);padding:13px 15px;border-radius:12px;color:#35536e;margin-top:14px}\n.organism{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}\n@media(max-width:850px){.organism{grid-template-columns:1fr}}\n.body-stage{min-height:560px;background:radial-gradient(circle at 50% 10%,#fff 0,#eef5ff 65%,#e5efff 100%);border-radius:22px;position:relative;overflow:hidden}\n.body-outline{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:270px;height:510px;border:5px solid #bfd2e8;border-radius:48% 48% 42% 42%;opacity:.45}\n.organ{position:absolute;left:50%;transform:translateX(-50%);border:0;cursor:pointer;color:#fff;font-weight:800;box-shadow:0 5px 14px rgba(0,0,0,.14);transition:.25s}\n.organ:hover{filter:brightness(1.08);transform:translateX(-50%) scale(1.05)}\n.mouth{top:44px;background:#ff6b81;border-radius:50px;width:72px;height:34px}.esophagus{top:78px;background:#f5a45c;width:25px;height:108px;border-radius:20px}\n.stomach{top:168px;background:#e96a86;width:120px;height:82px;border-radius:55% 45% 55% 45%;transform:translateX(-42%) rotate(12deg)}\n.small{top:252px;background:#54b7a7;width:155px;height:125px;border-radius:45%;padding-top:45px}.large{top:270px;background:#8a9bea;width:195px;height:155px;border-radius:48%;padding-top:60px;z-index:-1}\n.rectum{top:406px;background:#6f7ccf;width:35px;height:82px;border-radius:20px}\n.liver{top:125px;left:60%;background:#a86b56;width:92px;height:55px;border-radius:50% 30% 50% 30%;transform:translateX(-5%)}\n.pancreas{top:225px;left:42%;background:#f0b35e;width:92px;height:25px;border-radius:50px;transform:translateX(-50%)}\n.liver:hover,.pancreas:hover{transform:scale(1.05)}\n.food-dot{position:absolute;z-index:20;width:22px;height:22px;background:#ffcc33;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(255,204,51,.25);display:none}\n.food-dot.run{display:block;animation:foodPath 6.5s linear forwards}\n@keyframes foodPath{\n  0%{left:calc(50% - 11px);top:50px}\n  16%{left:calc(50% - 11px);top:90px}\n  32%{left:calc(50% - 45px);top:185px}\n  48%{left:calc(50% - 20px);top:225px;transform:scale(1.5)}\n  70%{left:calc(50% - 35px);top:305px;transform:scale(1)}\n  88%{left:calc(50% - 70px);top:360px}\n  100%{left:calc(50% - 11px);top:438px}\n}\n.absorb{position:absolute;left:50%;top:330px;width:0;height:0;z-index:15}\n.nutrient{position:absolute;width:11px;height:11px;background:#ff9f43;border-radius:50%;opacity:0}\n.absorb.play .nutrient{animation:absorb 2s ease-in-out infinite}\n.nutrient:nth-child(1){left:-45px;top:0;animation-delay:0s!important}.nutrient:nth-child(2){left:-20px;top:25px;animation-delay:.3s!important}.nutrient:nth-child(3){left:20px;top:5px;animation-delay:.6s!important}.nutrient:nth-child(4){left:45px;top:30px;animation-delay:.9s!important}\n@keyframes absorb{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translateY(-65px) scale(.4)}}\n.organ-info{min-height:185px;background:#fbfdff;border:2px solid #e5edf6;border-radius:18px;padding:18px}\n.organ-info h3{margin-top:0;color:#315fd1}.organ-info p{line-height:1.55;color:#52697d}\n.animal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}\n@media(max-width:700px){.animal-grid{grid-template-columns:1fr}}\n.animal{border:2px solid #e8edf4;border-radius:20px;padding:18px;text-align:center;cursor:pointer;transition:.25s;background:white}\n.animal:hover,.animal.selected{border-color:#6a82e8;transform:translateY(-4px);box-shadow:var(--shadow)}\n.animal .emoji{font-size:72px}.animal h3{margin:8px}\n.animal-info{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}\n@media(max-width:700px){.animal-info{grid-template-columns:1fr}}\n.digestive-path{height:100px;background:#eef5ff;border-radius:18px;display:flex;align-items:center;justify-content:space-around;position:relative;overflow:hidden;margin-top:12px}\n.path-node{background:white;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:700;z-index:2}\n.path-ball{position:absolute;width:18px;height:18px;background:#ffbd2e;border-radius:50%;left:4%;top:41px;animation:animalPath 4s linear infinite}\n@keyframes animalPath{0%{left:4%}25%{left:29%}50%{left:52%}75%{left:75%}100%{left:94%}}\n.plate-area{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:850px){.plate-area{grid-template-columns:1fr}}\n.foods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}\n.food{padding:14px;border:2px solid #e8edf4;border-radius:16px;background:white;cursor:pointer;transition:.2s;text-align:left}\n.food:hover{transform:scale(1.02);border-color:#8ba4e9}.food span{font-size:28px;margin-right:7px}\n.plate{min-height:330px;border-radius:50%;background:radial-gradient(circle,#fff 0 55%,#eaf2ff 56% 70%,#cbdcf7 71%);border:9px solid #d5e4f8;display:flex;align-content:center;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:35px;position:relative}\n.plate.empty:after{content:\"Mahsulotlarni tanlab likopchaga qo‘shing\";position:absolute;color:#7890a6;text-align:center;font-weight:700}\n.plate-item{background:white;padding:7px 10px;border-radius:12px;box-shadow:0 3px 10px #ccd7e6;font-size:14px;animation:pop .3s}\n@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}\n.tip-card{padding:15px;border-radius:16px;background:#f6fbf8;border:1px solid #d9eee3;margin-top:12px;min-height:70px}\n.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}\n@media(max-width:700px){.meals{grid-template-columns:1fr}}\n.meal{border:2px dashed #cbd8e7;border-radius:16px;padding:12px;min-height:150px;background:#fbfdff}\n.meal h4{margin:0 0 10px}.meal button{display:block;width:100%;margin:5px 0;border:0;border-radius:10px;padding:8px;background:#eaf1ff;cursor:pointer}\n.meal button:hover{background:#dbe8ff}\n.result{margin-top:15px;padding:15px;border-radius:14px;font-weight:700;display:none}\n.result.show{display:block}.good{background:#dff7e9;color:#17653d}.warn{background:#fff1d8;color:#7a4b00}\n.quiz-question{font-size:19px;font-weight:700;margin-bottom:14px}\n.answers{display:grid;gap:9px}.answer{border:2px solid #e2e9f2;background:white;border-radius:13px;padding:12px;text-align:left;cursor:pointer}.answer:hover{border-color:#7b94e9}.answer.correct{background:#dcf8e8;border-color:#3dbb7a}.answer.wrong{background:#ffe4e4;border-color:#ef7474}\n.feedback{padding:12px;border-radius:12px;margin-top:12px;display:none}.feedback.show{display:block}\n.score{text-align:center;padding:25px;background:linear-gradient(135deg,#eff5ff,#fff7ed);border-radius:20px}\n.score .big{font-size:50px;font-weight:900;color:#315fd1}\nfooter{display:flex;justify-content:space-between;gap:10px;margin:18px 0;flex-wrap:wrap}\n.hidden{display:none!important}\n.small-note{color:var(--muted);font-size:13px}\n.toast{position:fixed;right:18px;bottom:18px;background:#183b5b;color:#fff;padding:13px 17px;border-radius:13px;box-shadow:var(--shadow);opacity:0;transform:translateY(20px);transition:.3s;z-index:100}.toast.show{opacity:1;transform:none}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n<header>\n  <h1>🍎 Ovqat hazm qilish sistemasi<\/h1>\n  <p class=\"subtitle\">6-sinf Tabiiy fanlar — interaktiv ta’limiy simulyatsiya<\/p>\n  <div class=\"progress\">\n    <div class=\"step active\" data-step=\"0\">1 · Inson<\/div>\n    <div class=\"step\" data-step=\"1\">2 · Hayvonlar<\/div>\n    <div class=\"step\" data-step=\"2\">3 · Ovqatlanish<\/div>\n    <div class=\"step\" data-step=\"3\">4 · Test<\/div>\n  <\/div>\n<\/header>\n\n<main>\n<section class=\"section active\" id=\"sec0\">\n  <div class=\"panel\">\n    <div class=\"section-title\"><h2>1. Insonlarning ovqat hazm qilish sistemasi<\/h2><span class=\"badge\">Interaktiv anatomiya<\/span><\/div>\n    <p>Organ ustiga bosing — uning vazifasini bilib oling. So‘ng ovqat zarrachasining yo‘lini kuzating.<\/p>\n    <div class=\"organism\">\n      <div class=\"body-stage\">\n        <div class=\"body-outline\"><\/div>\n        <button class=\"organ mouth\" data-organ=\"Og‘iz bo‘shlig‘i\">Og‘iz<\/button>\n        <button class=\"organ esophagus\" data-organ=\"Qizilo‘ngach\">Qizilo‘ngach<\/button>\n        <button class=\"organ stomach\" data-organ=\"Oshqozon\">Oshqozon<\/button>\n        <button class=\"organ small\" data-organ=\"Ingichka ichak\">Ingichka ichak<\/button>\n        <button class=\"organ large\" data-organ=\"Yo‘g‘on ichak\">Yo‘g‘on ichak<\/button>\n        <button class=\"organ rectum\" data-organ=\"To‘g‘ri ichak\">To‘g‘ri ichak<\/button>\n        <button class=\"organ liver\" data-organ=\"Jigar\">Jigar<\/button>\n        <button class=\"organ pancreas\" data-organ=\"Oshqozon osti bezi\">Oshqozon osti bezi<\/button>\n        <div class=\"food-dot\" id=\"foodDot\"><\/div>\n        <div class=\"absorb\" id=\"absorb\"><i class=\"nutrient\"><\/i><i class=\"nutrient\"><\/i><i class=\"nutrient\"><\/i><i class=\"nutrient\"><\/i><\/div>\n      <\/div>\n      <div>\n        <div class=\"organ-info\" id=\"organInfo\">\n          <h3>👆 Organ tanlang<\/h3>\n          <p>Rasmdagi organlardan birini bosing. Uning nomi, vazifasi va ovqat hazm qilishdagi rolini shu yerda ko‘rasiz.<\/p>\n        <\/div>\n        <div class=\"info\"><b>Ovqat yo‘li:<\/b><br>Og‘iz → Qizilo‘ngach → Oshqozon → Ingichka ichak → Yo‘g‘on ichak → To‘g‘ri ichak<\/div>\n        <div class=\"controls\">\n          <button class=\"btn primary\" id=\"startFood\">▶ Ovqat yo‘lini boshlash<\/button>\n          <button class=\"btn green\" id=\"absorbBtn\">✨ So‘rilishni ko‘rsat<\/button>\n        <\/div>\n        <div class=\"tip-card\" id=\"digestTip\">Animatsiya boshlanganda oziq zarrachasi organlar bo‘ylab harakat qiladi.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"panel\">\n    <h3>🧩 Mini-topshiriq: A’zoni vazifasi bilan moslashtir<\/h3>\n    <p id=\"matchQuestion\">Qaysi a’zoda oziq moddalarning katta qismi qonga so‘riladi?<\/p>\n    <div class=\"controls\">\n      <button class=\"btn gray match\" data-correct=\"false\">Oshqozon<\/button>\n      <button class=\"btn gray match\" data-correct=\"true\">Ingichka ichak<\/button>\n      <button class=\"btn gray match\" data-correct=\"false\">Yo‘g‘on ichak<\/button>\n    <\/div>\n    <div class=\"feedback\" id=\"matchFeedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sec1\">\n  <div class=\"panel\">\n    <div class=\"section-title\"><h2>2. Hayvonlarda ovqat hazm qilish sistemasi<\/h2><span class=\"badge\">Taqqosla va kuzat<\/span><\/div>\n    <p>Hayvonlarning oziqlanishiga mos ravishda ovqat hazm qilish sistemasida ayrim farqlar bo‘ladi.<\/p>\n    <div class=\"animal-grid\">\n      <div class=\"animal\" data-animal=\"cow\"><div class=\"emoji\">🐄<\/div><h3>Sigir<\/h3><p>O‘simlikxo‘r<\/p><\/div>\n      <div class=\"animal\" data-animal=\"chicken\"><div class=\"emoji\">🐔<\/div><h3>Tovuq<\/h3><p>Don va turli oziqlar<\/p><\/div>\n      <div class=\"animal\" data-animal=\"fish\"><div class=\"emoji\">🐟<\/div><h3>Baliq<\/h3><p>Suv hayvoni<\/p><\/div>\n    <\/div>\n    <div class=\"animal-info\">\n      <div class=\"panel\" style=\"margin:0\">\n        <h3 id=\"animalTitle\">Hayvonni tanlang<\/h3>\n        <p id=\"animalDesc\">Hayvon ustiga bosing. Uning oziqlanishi va ovqat hazm qilish yo‘li haqida ma’lumot chiqadi.<\/p>\n        <div class=\"digestive-path\" id=\"animalPath\"><span class=\"path-node\">Og‘iz<\/span><span class=\"path-node\">Hazm organlari<\/span><span class=\"path-node\">Ichak<\/span><span class=\"path-node\">Chiqindi<\/span><span class=\"path-ball\"><\/span><\/div>\n      <\/div>\n      <div class=\"panel\" style=\"margin:0\">\n        <h3>👤 Inson bilan taqqoslash<\/h3>\n        <div id=\"compareBox\">Avval hayvonni tanlang.<\/div>\n        <button class=\"btn pink\" id=\"compareBtn\" style=\"margin-top:12px\">🔍 Inson va hayvon<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"panel\">\n    <h3>🧩 Mini-topshiriq: Qaysi hayvon qanday oziqlanadi?<\/h3>\n    <p>Sigirning asosiy oziqlanish turini belgilang:<\/p>\n    <div class=\"controls\">\n      <button class=\"btn gray animalQ\" data-correct=\"true\">O‘simlikxo‘r<\/button>\n      <button class=\"btn gray animalQ\" data-correct=\"false\">Faqat go‘shtxo‘r<\/button>\n      <button class=\"btn gray animalQ\" data-correct=\"false\">Faqat hasharotxo‘r<\/button>\n    <\/div>\n    <div class=\"feedback\" id=\"animalFeedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sec2\">\n  <div class=\"panel\">\n    <div class=\"section-title\"><h2>3. To‘g‘ri ovqatlanishning ahamiyati<\/h2><span class=\"badge\">Kundalik tanlov<\/span><\/div>\n    <p>Mahsulotlarni bosib, foydasi yoki ortiqcha iste’mol qilinganda nimalarga e’tibor berish kerakligini bilib oling.<\/p>\n    <div class=\"plate-area\">\n      <div>\n        <h3>🛒 Mahsulotlar<\/h3>\n        <div class=\"foods\" id=\"foods\"><\/div>\n        <div class=\"tip-card\" id=\"foodTip\">Mahsulotlardan birini tanlang.<\/div>\n      <\/div>\n      <div>\n        <h3>🍽️ Sog‘lom ovqatlanish likopchasi<\/h3>\n        <div class=\"plate empty\" id=\"plate\"><\/div>\n        <button class=\"btn gray\" id=\"clearPlate\" style=\"margin-top:12px\">Likopchani tozalash<\/button>\n      <\/div>\n    <\/div>\n  <\/div>\n  <div class=\"panel\">\n    <h3>📅 Bir kunlik ovqatlanish ratsionini tuz<\/h3>\n    <p>Har bir ovqatlanish vaqti uchun mahsulot tanlang. Tanlovingizni keyin avtomatik tekshiramiz.<\/p>\n    <div class=\"meals\" id=\"meals\"><\/div>\n    <button class=\"btn green\" id=\"checkDiet\" style=\"margin-top:14px\">✅ Ratsionni tekshirish<\/button>\n    <div class=\"result\" id=\"dietResult\"><\/div>\n  <\/div>\n  <div class=\"panel\">\n    <h3>🎬 Sog‘lom va noto‘g‘ri odatlarni taqqoslash<\/h3>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n      <div class=\"tip-card\"><b>🌱 Muvozanatli odat<\/b><p>Turli oziq guruhlaridan tanlash, suv ichish va me’yorni saqlash.<\/p><\/div>\n      <div class=\"tip-card\" style=\"background:#fff7f7;border-color:#f4dada\"><b>🍔 Haddan tashqari odat<\/b><p>Shirinlik, fast food va shirin gazli ichimliklarni tez-tez va ko‘p iste’mol qilish.<\/p><\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section class=\"section\" id=\"sec3\">\n  <div class=\"panel\">\n    <div class=\"section-title\"><h2>4. Yakuniy bilim testi<\/h2><span class=\"badge\">5 ta savol<\/span><\/div>\n    <div id=\"quiz\"><\/div>\n    <div class=\"score hidden\" id=\"score\"><\/div>\n    <button class=\"btn primary hidden\" id=\"restartQuiz\" style=\"margin-top:14px\">🔄 Testni qayta boshlash<\/button>\n  <\/div>\n<\/section>\n<\/main>\n\n<footer>\n  <button class=\"btn gray\" id=\"backBtn\">← Orqaga<\/button>\n  <button class=\"btn orange\" id=\"resetBtn\">↻ Qayta boshlash<\/button>\n  <button class=\"btn primary\" id=\"nextBtn\">Keyingi →<\/button>\n<\/footer>\n<div class=\"toast\" id=\"toast\"><\/div>\n<\/div>\n\n<script>\nconst organData={\n\"Og‘iz bo‘shlig‘i\":{title:\"Og‘iz bo‘shlig‘i\",text:\"Ovqat tishlar yordamida maydalanadi va so‘lak bilan aralashadi. Hazm jarayoni shu yerdan boshlanadi.\"},\n\"Qizilo‘ngach\":{title:\"Qizilo‘ngach\",text:\"Mushaklari yordamida ovqatni og‘izdan oshqozonga tomon surib boradi.\"},\n\"Oshqozon\":{title:\"Oshqozon\",text:\"Ovqat aralashtiriladi. Oshqozon shirasi yordamida hazm bo‘lish jarayoni davom etadi.\"},\n\"Ingichka ichak\":{title:\"Ingichka ichak\",text:\"Hazm qilishning asosiy qismi shu yerda davom etadi. Oziq moddalarning katta qismi qonga so‘riladi.\"},\n\"Yo‘g‘on ichak\":{title:\"Yo‘g‘on ichak\",text:\"Suv va ayrim moddalar so‘riladi. Ovqat qoldig‘i najas shakllanishi tomon harakat qiladi.\"},\n\"To‘g‘ri ichak\":{title:\"To‘g‘ri ichak\",text:\"Ovqat hazm bo‘lmay qolgan qoldiqlar vaqtincha to‘planadi va organizmdan chiqariladi.\"},\n\"Jigar\":{title:\"Jigar\",text:\"Jigar o‘t suyuqligini hosil qiladi. O‘t yog‘larning hazm bo‘lishiga yordam beradi.\"},\n\"Oshqozon osti bezi\":{title:\"Oshqozon osti bezi\",text:\"Hazm qilishda yordam beradigan fermentlarga boy shirani ishlab chiqaradi.\"}\n};\ndocument.querySelectorAll(\".organ\").forEach(b=>b.addEventListener(\"click\",()=>{\n const d=organData[b.dataset.organ];\n document.getElementById(\"organInfo\").innerHTML=`<h3>🔎 ${d.title}<\/h3><p>${d.text}<\/p>`;\n}));\nconst foodDot=document.getElementById(\"foodDot\"), absorb=document.getElementById(\"absorb\");\ndocument.getElementById(\"startFood\").onclick=()=>{\n foodDot.classList.remove(\"run\"); void foodDot.offsetWidth; foodDot.classList.add(\"run\");\n document.getElementById(\"digestTip\").textContent=\"Oziq zarrachasi yo‘l bo‘ylab harakatlanmoqda: og‘iz → qizilo‘ngach → oshqozon → ichaklar.\";\n setTimeout(()=>document.getElementById(\"digestTip\").textContent=\"Oshqozonda ovqat aralashtiriladi, ichaklarda esa oziq moddalar ajralib, foydali moddalar qonga so‘riladi.\",6500);\n};\ndocument.getElementById(\"absorbBtn\").onclick=()=>{\n absorb.classList.remove(\"play\"); void absorb.offsetWidth; absorb.classList.add(\"play\");\n document.getElementById(\"digestTip\").textContent=\"✨ Ingichka ichakda oziq moddalari juda kichik zarrachalarga ajralib, qonga so‘rilmoqda.\";\n};\nfunction feedback(el,ok,text){el.className=\"feedback show \"+(ok?\"good\":\"warn\");el.textContent=(ok?\"✅ To‘g‘ri! \":\"❌ Noto‘g‘ri. \")+text}\ndocument.querySelectorAll(\".match\").forEach(x=>x.onclick=()=>feedback(document.getElementById(\"matchFeedback\"),x.dataset.correct===\"true\",\"Ingichka ichakda oziq moddalarning katta qismi qonga so‘riladi.\"));\ndocument.querySelectorAll(\".animalQ\").forEach(x=>x.onclick=()=>feedback(document.getElementById(\"animalFeedback\"),x.dataset.correct===\"true\",\"Sigir o‘simlikxo‘r hayvon.\"));\n\nconst animals={\ncow:{title:\"🐄 Sigir — o‘simlikxo‘r\",desc:\"Sigir o‘simliklar bilan oziqlanadi. Uning oshqozoni bir necha bo‘limdan iborat bo‘lib, o‘simlik ozuqasini hazm qilishga moslashgan. Sigir yutilgan ozuqaning bir qismini qayta og‘izga chiqarib, yana chaynaydi — bu kavsh qaytarish deyiladi.\",compare:\"Insonning oshqozoni bir bo‘limli. Sigirda esa o‘simlik ozuqasini hazm qilishga moslashgan murakkabroq oshqozon mavjud.\"},\nchicken:{title:\"🐔 Tovuq — don va turli oziqlar\",desc:\"Tovuq don, urug‘, o‘simlik qismlari va boshqa mayda oziqlarni yeyishi mumkin. Uning hazm sistemasida oziqni saqlashga va maydalashga yordam beradigan o‘ziga xos qismlar mavjud.\",compare:\"Inson va tovuqda ovqat yo‘li asosiy jihatdan og‘izdan ichaklargacha davom etadi, ammo tovuqning hazm organlari qushlarga xos tuzilishga ega.\"},\nfish:{title:\"🐟 Baliq — suv hayvoni\",desc:\"Baliq suvda yashaydi va oziqni og‘iz orqali qabul qiladi. Oziq hazm yo‘li bo‘ylab harakatlanadi, hazm bo‘lgan moddalar organizmga so‘riladi.\",compare:\"Inson quruqlikda, baliq esa suvda yashaydi. Shunga qaramay, ikkalasida ham oziqni qabul qilish, hazm qilish va oziq moddalarni so‘rish jarayonlari mavjud.\"}\n};\nlet selectedAnimal=null;\ndocument.querySelectorAll(\".animal\").forEach(a=>a.onclick=()=>{\n document.querySelectorAll(\".animal\").forEach(x=>x.classList.remove(\"selected\"));a.classList.add(\"selected\");\n selectedAnimal=a.dataset.animal; const d=animals[selectedAnimal];\n document.getElementById(\"animalTitle\").textContent=d.title;\n document.getElementById(\"animalDesc\").textContent=d.desc;\n document.getElementById(\"compareBox\").textContent=d.compare;\n});\ndocument.getElementById(\"compareBtn\").onclick=()=>{\n if(!selectedAnimal){toast(\"Avval sigir, tovuq yoki baliqni tanlang.\");return}\n document.getElementById(\"compareBox\").textContent=animals[selectedAnimal].compare;\n};\n\nconst foodData=[\n[\"🍎\",\"Mevalar\",\"Vitamin, mineral va kletchatkaga boy.\",\"good\"],\n[\"🥕\",\"Sabzavotlar\",\"Vitamin, mineral va kletchatkaga boy.\",\"good\"],\n[\"🌾\",\"Don mahsulotlari\",\"Energiya va uglevodlarning muhim manbalaridan.\",\"good\"],\n[\"🥛\",\"Sut mahsulotlari\",\"Oqsil va kalsiy kabi moddalarni beradi.\",\"good\"],\n[\"🥩\",\"Go‘sht va oqsil\",\"Oqsil, temir va boshqa oziq moddalar manbai.\",\"good\"],\n[\"🍰\",\"Shirinliklar\",\"Me’yorida iste’mol qilish mumkin, lekin ortiqchasi tavsiya etilmaydi.\",\"warn\"],\n[\"🍔\",\"Fast food\",\"Tez-tez va ko‘p iste’mol qilish muvozanatli ovqatlanishga mos kelmaydi.\",\"warn\"],\n[\"🥤\",\"Gazli ichimlik\",\"Shirin gazli ichimliklarni ko‘p ichish sog‘lom ovqatlanish talablariga mos kelmaydi.\",\"warn\"]\n];\nconst foods=document.getElementById(\"foods\");\nfoodData.forEach((f,i)=>{\n const b=document.createElement(\"button\");b.className=\"food\";b.innerHTML=`<span>${f[0]}<\/span><b>${f[1]}<\/b>`;\n b.onclick=()=>{document.getElementById(\"foodTip\").innerHTML=`<b>${f[1]}<\/b> — ${f[2]}`; addPlate(i);};foods.appendChild(b);\n});\nlet plateItems=[];\nfunction addPlate(i){plateItems.push(i);renderPlate()}\nfunction renderPlate(){\n const p=document.getElementById(\"plate\");p.innerHTML=\"\";\n p.classList.toggle(\"empty\",plateItems.length===0);\n plateItems.slice(-12).forEach(i=>{const x=document.createElement(\"div\");x.className=\"plate-item\";x.textContent=foodData[i][0]+\" \"+foodData[i][1];p.appendChild(x)});\n}\ndocument.getElementById(\"clearPlate\").onclick=()=>{plateItems=[];renderPlate()};\n\nconst mealData=[[\"Nonushta\",[\"🌾 Don mahsulotlari\",\"🍎 Mevalar\",\"🥛 Sut mahsulotlari\",\"🍰 Shirinliklar\"]],[\"Tushlik\",[\"🥕 Sabzavotlar\",\"🥩 Go‘sht va oqsil\",\"🌾 Don mahsulotlari\",\"🍔 Fast food\"]],[\"Kechki ovqat\",[\"🥕 Sabzavotlar\",\"🥩 Go‘sht va oqsil\",\"🥛 Sut mahsulotlari\",\"🍔 Fast food\"]]];\nconst meals=document.getElementById(\"meals\");let diet=[null,null,null];\nmealData.forEach((m,mi)=>{\n const d=document.createElement(\"div\");d.className=\"meal\";d.innerHTML=`<h4>${m[0]}<\/h4>`;\n m[1].forEach(v=>{const b=document.createElement(\"button\");b.textContent=v;b.onclick=()=>{diet[mi]=v;d.querySelectorAll(\"button\").forEach(q=>q.style.fontWeight=\"normal\");b.style.fontWeight=\"800\";b.style.background=\"#d8f4e5\";};d.appendChild(b)});\n meals.appendChild(d);\n});\ndocument.getElementById(\"checkDiet\").onclick=()=>{\n if(diet.includes(null)){document.getElementById(\"dietResult\").className=\"result show warn\";document.getElementById(\"dietResult\").textContent=\"⚠️ Avval nonushta, tushlik va kechki ovqat uchun mahsulot tanlang.\";return}\n const bad=diet.filter(x=>x.includes(\"Fast food\")).length;\n const sweets=diet.filter(x=>x.includes(\"Shirinlik\")).length;\n const good=diet.filter(x=>x.includes(\"Sabzavot\")||x.includes(\"Mevalar\")||x.includes(\"Don\")||x.includes(\"Sut\")||x.includes(\"Go‘sht\")).length;\n const ok=bad===0 && good>=2 && sweets<=1;\n const r=document.getElementById(\"dietResult\");r.className=\"result show \"+(ok?\"good\":\"warn\");\n r.textContent=ok?\"✅ Muvozanatli ratsion: turli oziq guruhlari tanlangan.\":\"🔎 Ratsionni yaxshilash kerak: sabzavot, meva, don, sut yoki oqsilga boy mahsulotlarni ko‘paytirib, fast food va shirinliklarni me’yorlashga e’tibor bering.\";\n};\n\nconst questions=[\n {q:\"Ovqat hazm qilish yo‘li qayerdan boshlanadi?\",a:[\"Oshqozondan\",\"Og‘iz bo‘shlig‘idan\",\"Yo‘g‘on ichakdan\",\"To‘g‘ri ichakdan\"],c:1,e:\"Hazm jarayoni og‘iz bo‘shlig‘ida boshlanadi.\"},\n {q:\"Oziq moddalarning katta qismi qaysi a’zoda qonga so‘riladi?\",a:[\"Ingichka ichakda\",\"Qizilo‘ngachda\",\"Oshqozonda\",\"Og‘izda\"],c:0,e:\"Ingichka ichakda hazm bo‘lgan oziq moddalarning katta qismi qonga so‘riladi.\"},\n {q:\"Sigirning asosiy oziqlanish turi qaysi?\",a:[\"O‘simlikxo‘r\",\"Faqat go‘shtxo‘r\",\"Faqat hasharotxo‘r\",\"Faqat baliqxo‘r\"],c:0,e:\"Sigir o‘simlikxo‘r hayvon.\"},\n {q:\"Qaysi odat sog‘lom ovqatlanishga ko‘proq mos?\",a:[\"Faqat shirinlik yeyish\",\"Fast foodni tez-tez yeyish\",\"Turli va muvozanatli mahsulotlarni tanlash\",\"Gazli shirin ichimlikni ko‘p ichish\"],c:2,e:\"Turli oziq guruhlaridan muvozanatli tanlash sog‘lom ovqatlanishning muhim qismidir.\"},\n {q:\"Yo‘g‘on ichakning muhim vazifalaridan biri qaysi?\",a:[\"Ovqatni tishlash\",\"Suvning bir qismini so‘rish\",\"Ovqatni og‘izga olib kelish\",\"O‘t suyuqligini hosil qilish\"],c:1,e:\"Yo‘g‘on ichakda suvning bir qismi so‘riladi va ovqat qoldig‘i shakllanadi.\"}\n];\nlet qi=0,score=0,answered=false;\nfunction renderQuiz(){\n const q=questions[qi],box=document.getElementById(\"quiz\");\n box.innerHTML=`<div class=\"small-note\">Savol ${qi+1} / ${questions.length}<\/div><div class=\"quiz-question\">${q.q}<\/div><div class=\"answers\"><\/div><div class=\"feedback\" id=\"qFeedback\"><\/div>`;\n const ans=box.querySelector(\".answers\");\n q.a.forEach((v,i)=>{const b=document.createElement(\"button\");b.className=\"answer\";b.textContent=v;b.onclick=()=>answerQuiz(i,b);ans.appendChild(b)});\n}\nfunction answerQuiz(i,b){\n if(answered)return;answered=true;\n const q=questions[qi], all=document.querySelectorAll(\".answer\");all[q.c].classList.add(\"correct\");\n const fb=document.getElementById(\"qFeedback\");\n if(i===q.c){score++;b.classList.add(\"correct\");fb.className=\"feedback show good\";fb.textContent=\"✅ To‘g‘ri! \"+q.e}\n else{b.classList.add(\"wrong\");fb.className=\"feedback show warn\";fb.textContent=\"❌ Noto‘g‘ri. \"+q.e}\n setTimeout(()=>{qi++;answered=false;if(qi<questions.length)renderQuiz();else finishQuiz()},1100);\n}\nfunction finishQuiz(){\n document.getElementById(\"quiz\").innerHTML=\"\";\n const s=document.getElementById(\"score\");s.classList.remove(\"hidden\");\n let msg=score===5?\"A’lo!\":score===4?\"Juda yaxshi!\":score===3?\"Yaxshi, yana takrorlab ko‘r!\":\"Mavzuni yana bir bor ko‘rib chiq!\";\n s.innerHTML=`<div class=\"big\">${score}/5<\/div><h2>${msg}<\/h2><p>Natijangiz mavzudagi asosiy tushunchalarni qanchalik o‘zlashtirganingizni ko‘rsatadi.<\/p>`;\n document.getElementById(\"restartQuiz\").classList.remove(\"hidden\");\n}\ndocument.getElementById(\"restartQuiz\").onclick=()=>{qi=0;score=0;answered=false;document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"restartQuiz\").classList.add(\"hidden\");renderQuiz()};\n\nlet current=0;\nconst sections=[...document.querySelectorAll(\".section\")];\nfunction showSection(n){\n current=Math.max(0,Math.min(3,n));sections.forEach((s,i)=>s.classList.toggle(\"active\",i===current));\n document.querySelectorAll(\".step\").forEach((s,i)=>{s.classList.toggle(\"active\",i===current);s.classList.toggle(\"done\",i<current)});\n document.getElementById(\"backBtn\").disabled=current===0;\n document.getElementById(\"nextBtn\").textContent=current===3?\"Test tugadi ✓\":\"Keyingi →\";\n window.scrollTo({top:0,behavior:\"smooth\"});\n}\ndocument.getElementById(\"nextBtn\").onclick=()=>{if(current<3)showSection(current+1)};\ndocument.getElementById(\"backBtn\").onclick=()=>{if(current>0)showSection(current-1)};\ndocument.querySelectorAll(\".step\").forEach(s=>s.onclick=()=>showSection(+s.dataset.step));\nfunction resetAll(){\n current=0;showSection(0);plateItems=[];renderPlate();diet=[null,null,null];\n document.getElementById(\"dietResult\").className=\"result\";document.getElementById(\"foodTip\").textContent=\"Mahsulotlardan birini tanlang.\";\n selectedAnimal=null;document.querySelectorAll(\".animal\").forEach(x=>x.classList.remove(\"selected\"));\n document.getElementById(\"animalTitle\").textContent=\"Hayvonni tanlang\";document.getElementById(\"animalDesc\").textContent=\"Hayvon ustiga bosing. Uning oziqlanishi va ovqat hazm qilish yo‘li haqida ma’lumot chiqadi.\";\n qi=0;score=0;answered=false;renderQuiz();toast(\"Simulyatsiya qayta boshlandi.\");\n}\ndocument.getElementById(\"resetBtn\").onclick=resetAll;\nfunction toast(t){const x=document.getElementById(\"toast\");x.textContent=t;x.classList.add(\"show\");setTimeout(()=>x.classList.remove(\"show\"),2200)}\nrenderQuiz();\n<\/script>\n<\/body>\n<\/html>"}, {"icon": "🥗", "title": "Ratsional ovqatlanish", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Ratsional ovqatlanish — 6-sinf Tabiiy fanlar<\/title>\n<style>\n:root{\n  --bg:#f4f8fc;--card:#fff;--text:#17324d;--muted:#60758a;\n  --primary:#1976d2;--primary2:#42a5f5;--green:#2e9d61;--orange:#f59e0b;\n  --red:#e05252;--line:#dce7f0;--shadow:0 10px 30px rgba(31,70,100,.10);\n}\n*{box-sizing:border-box}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef7ff,#f8fbf5);color:var(--text)}\nbutton{font:inherit;cursor:pointer}\n.app{max-width:1180px;margin:auto;padding:18px}\nheader{background:linear-gradient(135deg,#1264b5,#27a66b);color:white;border-radius:24px;padding:28px 30px;box-shadow:var(--shadow)}\nheader h1{margin:0 0 8px;font-size:32px} header p{margin:0;opacity:.92}\n.progress{margin-top:20px;height:9px;background:#dfeaf2;border-radius:99px;overflow:hidden}\n.progress span{display:block;height:100%;background:linear-gradient(90deg,#1976d2,#31b76a);width:33.33%;transition:.4s}\nnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}\n.navbtn{border:1px solid var(--line);background:white;padding:11px 15px;border-radius:14px;color:var(--text);font-weight:700}\n.navbtn.active{background:#e8f3ff;color:#1264b5;border-color:#9bc9ef}\n.section{display:none}.section.active{display:block;animation:fade .35s}\n@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);margin-bottom:18px}\nh2{margin-top:0;font-size:25px}.lead{color:var(--muted);line-height:1.6}\n.definition{border-left:5px solid var(--primary);background:#edf6ff;padding:17px 19px;border-radius:12px;line-height:1.6}\n.food-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}\n.food{border:2px solid var(--line);background:#fff;border-radius:17px;padding:16px;text-align:center;transition:.2s;user-select:none}\n.food:hover{transform:translateY(-3px);border-color:#8fc3ec}.food .emoji{font-size:38px}.food strong{display:block;margin-top:7px}\n.info{margin-top:14px;padding:14px;border-radius:14px;background:#f5f9fc;min-height:58px;color:#36536a}\n.plate-area{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}\n.ingredients{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n.dragitem{background:#f8fbff;border:2px dashed #a9c9df;border-radius:14px;padding:12px;text-align:center;cursor:grab}\n.plate{min-height:330px;border-radius:50%;border:8px solid #e7edf3;background:radial-gradient(circle,#fff 0 56%,#f4f7fa 57%);display:flex;align-content:center;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;padding:50px;box-shadow:inset 0 0 0 2px #d8e2ea}\n.plate .placed{background:#e8f7ef;border-radius:12px;padding:8px 10px;font-size:28px}\n.feedback{margin-top:14px;padding:13px;border-radius:12px;display:none}.good{background:#e8f7ef;color:#1e7a4a}.warn{background:#fff4df;color:#8a5a00}.bad{background:#ffeded;color:#a83232}\n.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}\n.choice{border:2px solid var(--line);background:white;border-radius:16px;padding:18px;text-align:left}.choice:hover{border-color:#80b9e5}\n.choice .big{font-size:38px}\n.compare{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n.person{border-radius:18px;padding:20px}.balanced{background:#ebf8f0;border:2px solid #a8dfbd}.unbalanced{background:#fff4e5;border:2px solid #f2d19b}\n.person h3{margin-top:0}.meter{height:12px;background:#dfe7ed;border-radius:99px;overflow:hidden;margin:8px 0 15px}.meter span{display:block;height:100%;border-radius:99px}.green{background:#2e9d61}.yellow{background:#f59e0b}\n.digest-wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}\n.body-diagram{background:linear-gradient(#fff,#f4f9fc);border:1px solid var(--line);border-radius:20px;padding:18px;min-height:550px;position:relative;overflow:hidden}\n.body-outline{position:relative;width:300px;height:500px;margin:auto}\n.head{position:absolute;left:105px;top:8px;width:90px;height:90px;border-radius:50%;background:#ffd9c4;border:2px solid #e4ae95}\n.neck{position:absolute;left:130px;top:90px;width:40px;height:38px;background:#ffd9c4}\n.torso{position:absolute;left:70px;top:115px;width:160px;height:300px;border-radius:75px 75px 55px 55px;background:#f8d6c3;border:2px solid #e4ae95}\n.organ{position:absolute;left:50%;transform:translateX(-50%);border:2px solid #fff;box-shadow:0 2px 5px #7892a0;cursor:pointer;transition:.2s}\n.organ:hover{transform:translateX(-50%) scale(1.05)}\n.mouth{top:112px;width:54px;height:20px;background:#e66b78;border-radius:50%}\n.esophagus{top:132px;width:13px;height:75px;background:#e2a16e;border-radius:8px}\n.stomach{top:205px;width:75px;height:55px;background:#e9908d;border-radius:45% 45% 50% 50%}\n.small{top:265px;width:105px;height:105px;background:#f3c56b;border-radius:45%;border:7px solid #d99e4b}\n.large{top:255px;width:135px;height:135px;border:15px solid #83bd77;border-radius:42%;background:transparent;z-index:0}\n.rectum{top:380px;width:22px;height:45px;background:#83bd77;border-radius:12px}\n.organs-label{position:absolute;right:12px;top:12px;font-size:12px;color:#6d8191}\n.organ-card h3{margin-top:0}.organ-card .hint{color:var(--muted)}\n.journey{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:15px}.step{background:#eef6ff;border:2px solid #b8d8f2;padding:10px 13px;border-radius:12px;font-weight:700}.arrow{font-size:22px;color:#7c91a1}\n.quiz-q{font-size:20px;font-weight:700;margin-bottom:14px}.quiz-option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;padding:13px;border-radius:12px;margin:7px 0}.quiz-option.correct{border-color:#46a972;background:#eaf8f0}.quiz-option.wrong{border-color:#df6a6a;background:#ffeded}.quiz-explain{padding:12px;background:#f4f8fb;border-radius:10px;margin-top:10px}\n.nav-actions{display:flex;justify-content:space-between;margin:20px 0}.action{border:0;border-radius:14px;padding:13px 20px;background:#1264b5;color:white;font-weight:700}.action.secondary{background:#e8eef3;color:#29475d}\n.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summary div{background:#f5f9fc;border:1px solid var(--line);padding:15px;border-radius:14px}\n@media(max-width:800px){.food-grid{grid-template-columns:repeat(2,1fr)}.plate-area,.compare,.digest-wrap{grid-template-columns:1fr}.choice-grid,.summary{grid-template-columns:1fr}.body-outline{transform:scale(.9);transform-origin:top center}.ingredients{grid-template-columns:repeat(2,1fr)}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n<header>\n  <h1>🥗 Ratsional ovqatlanish<\/h1>\n  <p>6-sinf “Tabiiy fanlar” — interaktiv ta’limiy simulyatsiya<\/p>\n  <div class=\"progress\"><span id=\"progress\"><\/span><\/div>\n<\/header>\n\n<nav>\n  <button class=\"navbtn active\" data-go=\"0\">1. Ratsional ovqatlanish<\/button>\n  <button class=\"navbtn\" data-go=\"1\">2. Hayotdagi o‘rni<\/button>\n  <button class=\"navbtn\" data-go=\"2\">3. Ovqat hazm qilish<\/button>\n  <button class=\"navbtn\" data-go=\"3\">📝 Mini-quiz<\/button>\n<\/nav>\n\n<section class=\"section active\" id=\"s0\">\n<div class=\"card\">\n<h2>1. Ratsional ovqatlanish haqida tushuncha<\/h2>\n<div class=\"definition\"><b>Ratsional ovqatlanish<\/b> — inson organizmining energiya va oziq moddalarga bo‘lgan ehtiyojini hisobga olgan holda, xilma-xil, muvozanatli va me’yorida ovqatlanish.<\/div>\n<p class=\"lead\">Quyidagi mahsulotlardan birini bosing. Uning tarkibidagi asosiy oziq moddalar bilan tanishing.<\/p>\n<div class=\"food-grid\" id=\"foods\"><\/div>\n<div class=\"info\" id=\"foodInfo\">Mahsulotni tanlang — ma’lumot shu yerda chiqadi.<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🍽️ Interaktiv “Sog‘lom tarelka”<\/h2>\n<p class=\"lead\">Mahsulotlarni sichqoncha bilan tarelkaga sudrang. Maqsad — turli guruhlardan mahsulotlarni tanlab, muvozanatli ovqat tuzish.<\/p>\n<div class=\"plate-area\">\n<div class=\"ingredients\" id=\"ingredients\"><\/div>\n<div>\n<div class=\"plate\" id=\"plate\" ondragover=\"event.preventDefault()\" ondrop=\"dropFood(event)\"><span id=\"plateHint\">Mahsulotlarni shu yerga sudrang<\/span><\/div>\n<div class=\"feedback\" id=\"plateFeedback\"><\/div>\n<button class=\"action\" style=\"margin-top:10px\" onclick=\"checkPlate()\">Tarelkani tekshirish<\/button>\n<button class=\"action secondary\" style=\"margin-top:10px\" onclick=\"clearPlate()\">Tozalash<\/button>\n<\/div>\n<\/div>\n<\/div>\n<div class=\"nav-actions\"><span><\/span><button class=\"action\" onclick=\"go(1)\">Keyingi →<\/button><\/div>\n<\/section>\n\n<section class=\"section\" id=\"s1\">\n<div class=\"card\">\n<h2>2. Ratsional ovqatlanishning inson hayotidagi o‘rni<\/h2>\n<p class=\"lead\">Ovqatlanish tartibi organizmga energiya va zarur oziq moddalarni olishda muhim. Muvozanatli ratsion o‘sish, rivojlanish, o‘qish va jismoniy faoliyat uchun zarur moddalarni yetkazishga yordam beradi.<\/p>\n<div class=\"compare\">\n<div class=\"person balanced\"><h3>🧒 A) Muvozanatli ovqatlanadigan bola<\/h3>\n<p>⚡ Energiya olishga yordam beradi<\/p><div class=\"meter\"><span class=\"green\" style=\"width:88%\"><\/span><\/div>\n<p>📚 O‘qishga diqqatni jamlash uchun zarur oziq moddalarni oladi<\/p><div class=\"meter\"><span class=\"green\" style=\"width:84%\"><\/span><\/div>\n<p>🏃 Jismoniy faollik uchun energiya mavjud<\/p><div class=\"meter\"><span class=\"green\" style=\"width:90%\"><\/span><\/div>\n<p>🌱 O‘sish va rivojlanish uchun turli oziq moddalar olinadi<\/p>\n<\/div>\n<div class=\"person unbalanced\"><h3>🍟 B) Bir xil yoki nomutanosib ovqatlanish<\/h3>\n<p>⚠️ Energiya yetishmasligi yoki ortiqcha energiya bo‘lishi mumkin<\/p><div class=\"meter\"><span class=\"yellow\" style=\"width:58%\"><\/span><\/div>\n<p>⚠️ Ayrim oziq moddalar yetishmasligi mumkin<\/p><div class=\"meter\"><span class=\"yellow\" style=\"width:52%\"><\/span><\/div>\n<p>😴 Holsizlik yoki diqqat pasayishi kuzatilishi mumkin<\/p><div class=\"meter\"><span class=\"yellow\" style=\"width:48%\"><\/span><\/div>\n<p><b>Eslatma:<\/b> bular ta’limiy misollar; har bir insonning ehtiyoji turlicha.<\/p>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🤔 Qaysi nonushta sog‘lomroq?<\/h2>\n<div class=\"choice-grid\">\n<button class=\"choice\" onclick=\"breakfast(1)\"><div class=\"big\">🥤🍟<\/div><b>1. Faqat gazli ichimlik va chips<\/b><\/button>\n<button class=\"choice\" onclick=\"breakfast(2)\"><div class=\"big\">🥚🍞🥒💧<\/div><b>2. Tuxum, non, sabzavot va suv<\/b><\/button>\n<button class=\"choice\" onclick=\"breakfast(3)\"><div class=\"big\">🍬🍫🍭<\/div><b>3. Faqat shirinlik<\/b><\/button>\n<\/div>\n<div class=\"feedback\" id=\"breakfastFeedback\"><\/div>\n<\/div>\n<div class=\"nav-actions\"><button class=\"action secondary\" onclick=\"go(0)\">← Orqaga<\/button><button class=\"action\" onclick=\"go(2)\">Keyingi →<\/button><\/div>\n<\/section>\n\n<section class=\"section\" id=\"s2\">\n<div class=\"card\">\n<h2>3. Ovqat hazm qilish sistemasi<\/h2>\n<p class=\"lead\">Ovqat hazm qilish sistemasida ovqat maydalanadi, parchalanadi va undan organizm foydalanishi mumkin bo‘lgan oziq moddalar o‘zlashtiriladi. Diagrammadagi a’zolarni bosing.<\/p>\n<div class=\"digest-wrap\">\n<div class=\"body-diagram\">\n<div class=\"organs-label\">A’zoni bosing →<\/div>\n<div class=\"body-outline\">\n<div class=\"head\"><\/div><div class=\"neck\"><\/div><div class=\"torso\"><\/div>\n<div class=\"organ mouth\" title=\"Og‘iz bo‘shlig‘i\" onclick=\"organInfo('mouth')\"><\/div>\n<div class=\"organ esophagus\" title=\"Qizilo‘ngach\" onclick=\"organInfo('esophagus')\"><\/div>\n<div class=\"organ large\" title=\"Yo‘g‘on ichak\" onclick=\"organInfo('large')\"><\/div>\n<div class=\"organ stomach\" title=\"Oshqozon\" onclick=\"organInfo('stomach')\"><\/div>\n<div class=\"organ small\" title=\"Ingichka ichak\" onclick=\"organInfo('small')\"><\/div>\n<div class=\"organ rectum\" title=\"To‘g‘ri ichak\" onclick=\"organInfo('rectum')\"><\/div>\n<\/div>\n<\/div>\n<div class=\"card organ-card\" style=\"margin:0\">\n<h3 id=\"organTitle\">A’zoni tanlang<\/h3>\n<p id=\"organText\" class=\"hint\">Organ ustiga bosing. Uning nomi va vazifasi shu yerda chiqadi.<\/p>\n<div class=\"journey\">\n<div class=\"step\">Og‘iz<\/div><span class=\"arrow\">→<\/span><div class=\"step\">Qizilo‘ngach<\/div><span class=\"arrow\">→<\/span><div class=\"step\">Oshqozon<\/div><span class=\"arrow\">→<\/span><div class=\"step\">Ingichka ichak<\/div><span class=\"arrow\">→<\/span><div class=\"step\">Yo‘g‘on ichak<\/div><span class=\"arrow\">→<\/span><div class=\"step\">Tashqariga<\/div>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🍎 “Ovqat organizmda qanday sayohat qiladi?”<\/h2>\n<p class=\"lead\">Quyidagi ketma-ketlikni kuzating. Har bosqichda ovqat bilan nima sodir bo‘lishini bilib oling.<\/p>\n<div class=\"journey\" id=\"journey\"><\/div>\n<button class=\"action\" onclick=\"startJourney()\">▶ Animatsiyani boshlash<\/button>\n<div class=\"info\" id=\"journeyInfo\">Boshlash tugmasini bosing.<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🧪 Oziq moddasini top<\/h2>\n<div class=\"choice-grid\">\n<button class=\"choice\" onclick=\"matchNutrient('protein')\"><div class=\"big\">🥚<\/div><b>Oqsil<\/b><\/button>\n<button class=\"choice\" onclick=\"matchNutrient('carb')\"><div class=\"big\">🍞<\/div><b>Uglevod<\/b><\/button>\n<button class=\"choice\" onclick=\"matchNutrient('fat')\"><div class=\"big\">🥜<\/div><b>Yog‘<\/b><\/button>\n<button class=\"choice\" onclick=\"matchNutrient('vit')\"><div class=\"big\">🥕<\/div><b>Vitaminlar<\/b><\/button>\n<button class=\"choice\" onclick=\"matchNutrient('water')\"><div class=\"big\">💧<\/div><b>Suv<\/b><\/button>\n<\/div>\n<div class=\"feedback\" id=\"nutrientFeedback\"><\/div>\n<\/div>\n<div class=\"nav-actions\"><button class=\"action secondary\" onclick=\"go(1)\">← Orqaga<\/button><button class=\"action\" onclick=\"go(3)\">Mini-quiz →<\/button><\/div>\n<\/section>\n\n<section class=\"section\" id=\"s3\">\n<div class=\"card\">\n<h2>📝 5 savolli mini-quiz<\/h2>\n<p class=\"lead\">Har bir savolga javob bering. Natijangiz oxirida ko‘rsatiladi.<\/p>\n<div id=\"quiz\"><\/div>\n<div class=\"feedback\" id=\"quizResult\"><\/div>\n<\/div>\n<div class=\"card\" id=\"summary\" style=\"display:none\">\n<h2>🎉 Bugun nimalarni o‘rgandik?<\/h2>\n<div class=\"summary\">\n<div>🥗 <b>1.<\/b> Ratsional ovqatlanish — muvozanatli va me’yoridagi ovqatlanish.<\/div>\n<div>🍎 <b>2.<\/b> Turli xil oziq-ovqatlar organizmga turli xil oziq moddalarni beradi.<\/div>\n<div>🫀 <b>3.<\/b> Ovqat hazm qilish sistemasida oziq moddalar parchalanadi va organizm tomonidan o‘zlashtiriladi.<\/div>\n<\/div>\n<\/div>\n<div class=\"nav-actions\"><button class=\"action secondary\" onclick=\"go(2)\">← Orqaga<\/button><button class=\"action\" onclick=\"restart()\">🔄 Qayta boshlash<\/button><\/div>\n<\/section>\n<\/div>\n\n<script>\nconst foods=[\n{name:\"Non va don\",emoji:\"🍞\",group:\"don\",nutrients:\"uglevodlar, oqsillar, vitamin va mineral moddalar\"},\n{name:\"Go‘sht\",emoji:\"🥩\",group:\"protein\",nutrients:\"oqsillar, yog‘lar, temir kabi mineral moddalar\"},\n{name:\"Tuxum\",emoji:\"🥚\",group:\"protein\",nutrients:\"oqsillar, yog‘lar, vitamin va mineral moddalar\"},\n{name:\"Sut mahsulotlari\",emoji:\"🥛\",group:\"protein\",nutrients:\"oqsillar, yog‘lar, kalsiy va boshqa mineral moddalar\"},\n{name:\"Sabzavotlar\",emoji:\"🥕\",group:\"fruitveg\",nutrients:\"vitaminlar, mineral moddalar, suv va kletchatka\"},\n{name:\"Mevalar\",emoji:\"🍎\",group:\"fruitveg\",nutrients:\"vitaminlar, mineral moddalar, suv va uglevodlar\"},\n{name:\"Yong‘oqlar\",emoji:\"🥜\",group:\"protein\",nutrients:\"yog‘lar, oqsillar, mineral moddalar\"},\n{name:\"Suv\",emoji:\"💧\",group:\"water\",nutrients:\"suv\"}\n];\nconst foodsEl=document.getElementById(\"foods\"), ing=document.getElementById(\"ingredients\");\nfoods.forEach((f,i)=>{\n let b=document.createElement(\"button\");b.className=\"food\";b.innerHTML=`<div class=\"emoji\">${f.emoji}<\/div><strong>${f.name}<\/strong>`;b.onclick=()=>showFood(i);foodsEl.appendChild(b);\n let d=document.createElement(\"div\");d.className=\"dragitem\";d.draggable=true;d.dataset.i=i;d.innerHTML=`${f.emoji} ${f.name}`;d.ondragstart=e=>e.dataTransfer.setData(\"text/plain\",i);ing.appendChild(d);\n});\nfunction showFood(i){const f=foods[i];document.getElementById(\"foodInfo\").innerHTML=`<b>${f.name}<\/b> tarkibida asosan: <b>${f.nutrients}<\/b>. Har bir mahsulot turli oziq moddalarni turlicha miqdorda beradi.`}\nlet plateItems=[];\nfunction dropFood(e){e.preventDefault();let i=+e.dataTransfer.getData(\"text/plain\");if(!plateItems.includes(i)){plateItems.push(i);renderPlate()}}\nfunction renderPlate(){let p=document.getElementById(\"plate\");p.innerHTML=\"\";plateItems.forEach(i=>{let s=document.createElement(\"span\");s.className=\"placed\";s.textContent=foods[i].emoji;s.title=foods[i].name;p.appendChild(s)});if(!plateItems.length)p.innerHTML='<span id=\"plateHint\">Mahsulotlarni shu yerga sudrang<\/span>'}\nfunction checkPlate(){\n let groups=new Set(plateItems.map(i=>foods[i].group)), f=document.getElementById(\"plateFeedback\");\n f.style.display=\"block\";\n if(groups.has(\"don\")&&groups.has(\"fruitveg\")&&groups.has(\"protein\")&&groups.has(\"water\")){f.className=\"feedback good\";f.innerHTML=\"✅ <b>Muvozanatli ovqatlanish!<\/b> Tarelka turli oziq-ovqat guruhlarini o‘z ichiga oldi.\"}\n else if(plateItems.length<=2){f.className=\"feedback warn\";f.innerHTML=\"⚠️ Ratsion juda bir xil. Turli oziq-ovqatlardan tanlang: sabzavot/meva, don, oqsilga boy mahsulot va suv.\"}\n else{f.className=\"feedback warn\";f.innerHTML=\"💡 Yaxshi boshladingiz. Tarelka yanada muvozanatli bo‘lishi uchun yetishmayotgan guruhlarni qo‘shing.\"}\n}\nfunction clearPlate(){plateItems=[];renderPlate();document.getElementById(\"plateFeedback\").style.display=\"none\"}\nfunction breakfast(n){let f=document.getElementById(\"breakfastFeedback\");f.style.display=\"block\";if(n===2){f.className=\"feedback good\";f.innerHTML=\"✅ <b>2-variant.<\/b> Tuxum, non, sabzavot va suv turli oziq moddalarni olishga yordam beradi.\"}else{f.className=\"feedback warn\";f.innerHTML=\"💡 Bu variantda ratsion xilma-xilligi yetarli emas. Muvozanat uchun turli guruhlardan mahsulotlar tanlash kerak.\"}}\nconst organData={\nmouth:[\"Og‘iz bo‘shlig‘i\",\"Ovqat shu yerda qabul qilinadi. Tishlar uni mayda bo‘laklarga ajratadi, so‘lak esa ovqatni namlaydi va hazm jarayonining boshlanishiga yordam beradi.\"],\nesophagus:[\"Qizilo‘ngach\",\"Ovqatni yutgandan keyin uni oshqozonga olib boradigan naycha. Mushaklarining harakati ovqatni pastga suradi.\"],\nstomach:[\"Oshqozon\",\"Ovqat vaqtincha to‘planadigan va hazm jarayoni davom etadigan a’zo. Oshqozon shirasi ovqatni qayta ishlashga yordam beradi.\"],\nsmall:[\"Ingichka ichak\",\"Ovqat hazm bo‘lishining katta qismi shu yerda davom etadi. Oziq moddalarning asosiy qismi qonga so‘riladi.\"],\nlarge:[\"Yo‘g‘on ichak\",\"Hazm bo‘lmagan qoldiqlardan suvning bir qismi so‘riladi va najas shakllanadi.\"],\nrectum:[\"To‘g‘ri ichak\",\"Hazm bo‘lmagan qoldiqlar tashqariga chiqarilishidan oldin shu qismda to‘planadi.\"]\n};\nfunction organInfo(k){document.getElementById(\"organTitle\").textContent=organData[k][0];document.getElementById(\"organText\").textContent=organData[k][1]}\nconst journeyData=[\n[\"Og‘iz\",\"Tishlar ovqatni mayda bo‘laklarga ajratadi, so‘lak bilan aralashadi.\"],\n[\"Qizilo‘ngach\",\"Mushaklar harakati ovqatni oshqozonga suradi.\"],\n[\"Oshqozon\",\"Ovqat aralashadi va hazm jarayoni davom etadi.\"],\n[\"Ingichka ichak\",\"Oziq moddalarning asosiy qismi qonga so‘riladi.\"],\n[\"Yo‘g‘on ichak\",\"Suvning bir qismi so‘riladi; qoldiq shakllanadi.\"],\n[\"Tashqariga chiqarish\",\"Hazm bo‘lmagan qoldiqlar organizmdan chiqariladi.\"]\n];\nconst j=document.getElementById(\"journey\");journeyData.forEach((x,i)=>{let s=document.createElement(\"div\");s.className=\"step\";s.id=\"j\"+i;s.textContent=x[0];j.appendChild(s);if(i<journeyData.length-1){let a=document.createElement(\"span\");a.className=\"arrow\";a.textContent=\"→\";j.appendChild(a)}})\nfunction startJourney(){let i=0,info=document.getElementById(\"journeyInfo\");document.querySelectorAll(\"#journey .step\").forEach(x=>x.style.background=\"\");function next(){if(i>=journeyData.length)return;document.querySelectorAll(\"#journey .step\").forEach(x=>x.style.background=\"\");document.getElementById(\"j\"+i).style.background=\"#dff3e8\";info.innerHTML=`<b>${journeyData[i][0]}:<\/b> ${journeyData[i][1]}`;i++;setTimeout(next,1300)}next()}\nconst nutrientData={protein:\"Oqsil — o‘sish va hujayralar uchun muhim qurilish materiali.\",carb:\"Uglevod — organizm uchun asosiy energiya manbalaridan biri.\",fat:\"Yog‘ — energiya manbai va ayrim biologik jarayonlarda ishtirok etadi.\",vit:\"Vitaminlar — organizmdagi ko‘plab jarayonlarning normal kechishiga yordam beradi.\",water:\"Suv — organizm faoliyati uchun zarur.\"};\nfunction matchNutrient(k){let f=document.getElementById(\"nutrientFeedback\");f.style.display=\"block\";f.className=\"feedback good\";f.textContent=\"✅ \"+nutrientData[k]}\nconst questions=[\n[\"Ratsional ovqatlanish nimani anglatadi?\",[\"Faqat shirinlik yeyish\",\"Xilma-xil, muvozanatli va me’yorida ovqatlanish\",\"Faqat go‘sht yeyish\"],1],\n[\"Qaysi mahsulotlar oqsilga boy bo‘lishi mumkin?\",[\"Tuxum va go‘sht\",\"Faqat suv\",\"Faqat mevalar\"],0],\n[\"Oziq moddalarning asosiy qismi qayerda qonga so‘riladi?\",[\"Oshqozonda\",\"Ingichka ichakda\",\"Yo‘g‘on ichakda\"],1],\n[\"Yo‘g‘on ichakda suv bilan nima sodir bo‘ladi?\",[\"Suvning bir qismi so‘riladi\",\"Suv butunlay yo‘qoladi\",\"Suv hosil bo‘ladi\"],0],\n[\"Uglevodlarning asosiy vazifalaridan biri nima?\",[\"Energiya bilan ta’minlash\",\"Faqat suyak qurish\",\"Ovqatni oshqozonda saqlash\"],0]\n];\nlet quizScore=0,answered=0;\nfunction renderQuiz(){let q=document.getElementById(\"quiz\");q.innerHTML=\"\";questions.forEach((x,qi)=>{let box=document.createElement(\"div\");box.className=\"card\";box.style.boxShadow=\"none\";box.innerHTML=`<div class=\"quiz-q\">${qi+1}. ${x[0]}<\/div>`;x[1].forEach((opt,oi)=>{let b=document.createElement(\"button\");b.className=\"quiz-option\";b.textContent=opt;b.onclick=()=>answerQuiz(qi,oi,box);box.appendChild(b)});let ex=document.createElement(\"div\");ex.className=\"quiz-explain\";ex.style.display=\"none\";box.appendChild(ex);q.appendChild(box)})}\nfunction answerQuiz(qi,oi,box){if(box.dataset.done)return;box.dataset.done=\"1\";answered++;let bs=box.querySelectorAll(\".quiz-option\");bs[questions[qi][2]].classList.add(\"correct\");let ex=box.querySelector(\".quiz-explain\");if(oi===questions[qi][2]){quizScore++;ex.textContent=\"✅ To‘g‘ri javob!\";}else{bs[oi].classList.add(\"wrong\");ex.textContent=\"❌ Noto‘g‘ri. To‘g‘ri javob: \"+questions[qi][1][questions[qi][2]]+\". \"}ex.style.display=\"block\";if(answered===questions.length){let r=document.getElementById(\"quizResult\");r.style.display=\"block\";r.className=\"feedback good\";r.innerHTML=`<b>Natija: ${quizScore}/${questions.length}<\/b> — ${quizScore>=4?\"Mavzuni yaxshi o‘zlashtirdingiz!\":\"Yaxshi harakat. Mavzuni yana bir marta ko‘rib chiqing.\"}`;document.getElementById(\"summary\").style.display=\"block\"}}\nfunction go(n){document.querySelectorAll(\".section\").forEach((s,i)=>s.classList.toggle(\"active\",i===n));document.querySelectorAll(\".navbtn\").forEach((b,i)=>b.classList.toggle(\"active\",i===n));document.getElementById(\"progress\").style.width=((n+1)/4*100)+\"%\";window.scrollTo({top:0,behavior:\"smooth\"})}\nfunction restart(){plateItems=[];renderPlate();quizScore=0;answered=0;document.getElementById(\"quizResult\").style.display=\"none\";document.getElementById(\"summary\").style.display=\"none\";renderQuiz();go(0)}\ndocument.querySelectorAll(\".navbtn\").forEach(b=>b.onclick=()=>go(+b.dataset.go));\nrenderQuiz();\n<\/script>\n<\/body>\n<\/html>"}, {"icon": "🫁", "title": "Nafas va qon aylanish", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1.0\">\n<title>Nafas va qon aylanish sistemasi — 6-sinf<\/title>\n<style>\n*{box-sizing:border-box}\n:root{--bg:#f4f8ff;--card:#fff;--ink:#17324d;--muted:#64748b;--blue:#2563eb;--cyan:#06b6d4;--red:#ef4444;--deepred:#b91c1c;--green:#16a34a;--orange:#f59e0b;--purple:#7c3aed;--line:#dbe5f0}\nbody{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef7ff,#f9f5ff);color:var(--ink)}\nbutton{font:inherit;cursor:pointer;border:0}\n.app{max-width:1200px;margin:auto;padding:18px}\nheader{background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;border-radius:24px;padding:24px;box-shadow:0 14px 35px #3155a52b}\nheader h1{margin:0 0 8px;font-size:clamp(25px,4vw,40px)}\nheader p{margin:0;opacity:.94}\n.tabs{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap;position:sticky;top:0;z-index:10;background:#f4f8ffdd;padding:8px 0;backdrop-filter:blur(8px)}\n.tab{padding:13px 18px;border-radius:14px;background:#fff;color:#334155;border:1px solid var(--line);font-weight:700;flex:1;min-width:170px}\n.tab.active{background:#2563eb;color:#fff;border-color:#2563eb}\n.section{display:none}.section.active{display:block}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 24px #243b5310;margin-bottom:16px}\n.card h2,.card h3{margin-top:0}\n.info{background:#eef6ff;border-left:5px solid var(--blue);padding:13px 15px;border-radius:12px;line-height:1.55}\n.btn{padding:11px 16px;border-radius:12px;background:#2563eb;color:white;font-weight:700;margin:5px 4px 5px 0}\n.btn.secondary{background:#e8eef8;color:#234}.btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.orange{background:#f59e0b}.btn.purple{background:#7c3aed}\n.organ-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}\n.organ{padding:12px 7px;border-radius:12px;background:#eef5ff;border:2px solid transparent;font-weight:700;color:#1e3a8a}\n.organ:hover,.organ.selected{border-color:#2563eb;background:#dbeafe}\n.organ-info{min-height:100px;padding:15px;background:#f8fafc;border-radius:14px;margin-top:12px;line-height:1.55}\n.lung-scene{position:relative;height:390px;max-width:600px;margin:auto;background:radial-gradient(circle at 50% 45%,#fff 0 25%,#edf6ff 65%,#dcecff);border-radius:25px;overflow:hidden;border:1px solid var(--line)}\n.torso{position:absolute;left:50%;top:25px;transform:translateX(-50%);width:330px;height:330px;border:5px solid #94a3b8;border-radius:48% 48% 42% 42%;opacity:.65}\n.trachea{position:absolute;left:50%;top:55px;width:22px;height:145px;transform:translateX(-50%);background:#f0a0aa;border-radius:12px}\n.bronchus{position:absolute;top:175px;width:125px;height:12px;background:#e68b98;border-radius:8px}\n.b1{left:calc(50% - 125px);transform:rotate(28deg)}.b2{left:50%;transform:rotate(-28deg)}\n.lung{position:absolute;top:135px;width:115px;height:175px;background:linear-gradient(90deg,#fca5a5,#ef6b75);border:4px solid #c2414b;border-radius:58% 45% 55% 42%;transition:.5s}\n.leftlung{left:calc(50% - 150px)}.rightlung{left:calc(50% + 35px);transform:scaleX(-1)}\n.lung.breathe{transform:scale(1.09)}.rightlung.breathe{transform:scaleX(-1) scale(1.09)}\n.air{position:absolute;width:15px;height:15px;border-radius:50%;background:#06b6d4;box-shadow:0 0 12px #06b6d488;z-index:4;opacity:0}\n.air.in{animation:airIn 2.5s linear forwards}.air.out{animation:airOut 2.5s linear forwards}\n@keyframes airIn{0%{left:10px;top:45px;opacity:1}25%{left:35%;top:70px}55%{left:50%;top:145px}80%{left:55%;top:205px}100%{left:50%;top:250px;opacity:1}}\n@keyframes airOut{0%{left:50%;top:250px;opacity:1}25%{left:55%;top:205px}55%{left:50%;top:145px}80%{left:35%;top:70px}100%{left:10px;top:45px;opacity:0}}\n.alveola{position:relative;height:310px;background:#f8fbff;border-radius:20px;overflow:hidden;border:1px solid var(--line)}\n.alv{position:absolute;width:150px;height:150px;border-radius:50%;background:#ffd6dc;border:8px solid #ef8d9b;left:50%;top:78px;transform:translateX(-50%);box-shadow:inset 0 0 25px #fff}\n.cap{position:absolute;left:25%;right:25%;top:115px;height:90px;border:9px solid #8b5cf6;border-radius:50%;transform:rotate(-15deg);opacity:.8}\n.dot{position:absolute;width:13px;height:13px;border-radius:50%;z-index:2}\n.o2{background:#2563eb;box-shadow:0 0 7px #2563eb}.co2{background:#f59e0b;box-shadow:0 0 7px #f59e0b}\n.moveO{animation:moveO 3s linear infinite}.moveC{animation:moveC 3s linear infinite}\n@keyframes moveO{from{left:38%;top:120px}to{left:63%;top:170px}}\n@keyframes moveC{from{left:63%;top:195px}to{left:40%;top:145px}}\n.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:10px}.legend span{display:flex;align-items:center;gap:5px}.key{width:12px;height:12px;border-radius:50%}\n.heart-scene{height:370px;position:relative;background:#f8fafc;border-radius:20px;border:1px solid var(--line);overflow:hidden}\n.heart{position:absolute;left:50%;top:75px;transform:translateX(-50%) rotate(-45deg);width:145px;height:145px;background:#dc2626;border-radius:25px;transition:.25s}\n.heart:before,.heart:after{content:\"\";position:absolute;width:145px;height:145px;background:#dc2626;border-radius:50%}.heart:before{top:-72px}.heart:after{left:72px}\n.heart.beat{animation:beat .65s ease-in-out infinite}@keyframes beat{50%{transform:translateX(-50%) rotate(-45deg) scale(1.12)}}\n.chamber{position:absolute;z-index:3;width:46px;height:58px;border-radius:10px;background:#fee2e2;border:3px solid #991b1b;color:#7f1d1d;font-size:11px;font-weight:bold;text-align:center;padding-top:18px}\n.c1{left:calc(50% - 67px);top:145px}.c2{left:calc(50% + 18px);top:145px}.c3{left:calc(50% - 67px);top:220px}.c4{left:calc(50% + 18px);top:220px}\n.vessel{position:absolute;height:14px;border-radius:9px;opacity:.9}.artery{background:#ef4444}.vein{background:#2563eb}\n.v1{left:5%;top:190px;width:32%}.v2{right:5%;top:190px;width:32%}.v3{left:5%;top:270px;width:32%}.v4{right:5%;top:270px;width:32%}\n.bloodDot{position:absolute;width:11px;height:11px;border-radius:50%;z-index:5}.rDot{background:#ef4444}.bDot{background:#2563eb}\n.flow{animation:flow 2.5s linear infinite}@keyframes flow{from{transform:translateX(0)}to{transform:translateX(170px)}}\n.steps{display:grid;gap:8px}.step{padding:12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);opacity:.5}.step.active{opacity:1;border-color:#2563eb;background:#eff6ff;transform:translateX(4px)}\n.sequence{display:flex;gap:8px;flex-wrap:wrap;min-height:52px;padding:10px;border:2px dashed #cbd5e1;border-radius:14px}\n.seq-item{padding:10px 13px;border-radius:10px;background:#dbeafe;color:#1e3a8a;font-weight:700;cursor:pointer}.seq-item.used{opacity:.35;pointer-events:none}\n.options{display:grid;gap:8px}.option{padding:12px;border-radius:12px;border:2px solid var(--line);background:white;text-align:left}.option:hover{border-color:#2563eb}.option.correct{background:#dcfce7;border-color:#16a34a}.option.wrong{background:#fee2e2;border-color:#dc2626}\n.feedback{margin-top:10px;padding:12px;border-radius:12px;display:none}.feedback.show{display:block}\n.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}.match-select{padding:11px;border:1px solid var(--line);border-radius:10px;width:100%}\n.progress{height:10px;background:#e2e8f0;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#06b6d4,#2563eb,#7c3aed);width:0;transition:.4s}\n.footer-nav{display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:8px;background:#ffffffdd;padding:10px;border-radius:16px;backdrop-filter:blur(8px);border:1px solid var(--line)}\n.result{font-size:22px;font-weight:800;padding:16px;border-radius:16px;background:#eff6ff;text-align:center}\n@media(max-width:800px){.grid{grid-template-columns:1fr}.organ-grid{grid-template-columns:repeat(2,1fr)}.lung-scene{height:340px}.heart-scene{height:340px}.app{padding:10px}.card{padding:15px}.tab{min-width:145px}}\n<\/style>\n<\/head>\n<body>\n<div class=\"app\">\n<header>\n<h1>🫁 Nafas va qon aylanish sistemasi<\/h1>\n<p>6-sinf “Tabiiy fanlar” • Interaktiv dars-simulyatsiya<\/p>\n<\/header>\n\n<div class=\"tabs\">\n<button class=\"tab active\" onclick=\"showSection(1)\">1. Nafas sistemasi<\/button>\n<button class=\"tab\" onclick=\"showSection(2)\">2. Qon aylanish sistemasi<\/button>\n<button class=\"tab\" onclick=\"showSection(3)\">3. Ularning bog‘liqligi<\/button>\n<\/div>\n\n<main>\n<section id=\"s1\" class=\"section active\">\n<div class=\"card\">\n<h2>🔎 Nima uchun nafas olamiz?<\/h2>\n<div class=\"info\">Inson yashashi va hujayralarning faoliyati uchun kislorod zarur. Nafas olish sistemasi organizmga kislorod kirishini va karbonat angidridning tashqariga chiqarilishini ta’minlaydi.<\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🫁 Nafas sistemasi organlarini o‘rganamiz<\/h2>\n<p>Organ nomini bosing. Uning vazifasi pastda ko‘rsatiladi.<\/p>\n<div class=\"organ-grid\" id=\"organs\"><\/div>\n<div class=\"organ-info\" id=\"organInfo\">Biror organ ustiga bosing.<\/div>\n<\/div>\n\n<div class=\"grid\">\n<div class=\"card\">\n<h3>🌬️ Nafas olish va chiqarish<\/h3>\n<div class=\"lung-scene\" id=\"lungScene\">\n<div class=\"torso\"><\/div><div class=\"trachea\"><\/div><div class=\"bronchus b1\"><\/div><div class=\"bronchus b2\"><\/div>\n<div class=\"lung leftlung\"><\/div><div class=\"lung rightlung\"><\/div>\n<\/div>\n<button class=\"btn\" onclick=\"breathe('in')\">🌬️ Nafas olish<\/button>\n<button class=\"btn orange\" onclick=\"breathe('out')\">💨 Nafas chiqarish<\/button>\n<button class=\"btn secondary\" onclick=\"resetBreath()\">Qayta boshlash<\/button>\n<p id=\"breathMsg\" class=\"info\">Nafas olishda havo burun orqali kirib, nafas yo‘llari orqali o‘pkaga boradi.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h3>🔬 Alveola simulyatsiyasi<\/h3>\n<p>Alveolani kuzating: ko‘k — kislorod, sariq — karbonat angidrid.<\/p>\n<div class=\"alveola\" id=\"alveola\">\n<div class=\"cap\"><\/div><div class=\"alv\"><\/div>\n<div class=\"dot o2 moveO\"><\/div><div class=\"dot o2 moveO\" style=\"animation-delay:1s\"><\/div>\n<div class=\"dot co2 moveC\"><\/div><div class=\"dot co2 moveC\" style=\"animation-delay:1.4s\"><\/div>\n<\/div>\n<div class=\"legend\"><span><i class=\"key\" style=\"background:#2563eb\"><\/i>Kislorod<\/span><span><i class=\"key\" style=\"background:#f59e0b\"><\/i>Karbonat angidrid<\/span><span>🟣 Kapillyar<\/span><\/div>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h3>🧠 Topshiriq 1: Organlarni ketma-ket joylashtiring<\/h3>\n<p>Quyidagi tugmalarni to‘g‘ri tartibda bosing:<\/p>\n<div class=\"sequence\" id=\"seq1\"><\/div>\n<div id=\"seqResult\" class=\"feedback\"><\/div>\n<\/div>\n\n<div class=\"card\">\n<h3>❓ Topshiriq 2: Nafas olishda qaysi gaz qonga o‘tadi?<\/h3>\n<div class=\"options\" id=\"q1\"><\/div>\n<div id=\"q1fb\" class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section id=\"s2\" class=\"section\">\n<div class=\"card\">\n<h2>❤️ Qon aylanish sistemasi<\/h2>\n<div class=\"info\">Qon aylanish sistemasining asosiy qismlari: <b>yurak, qon tomirlari va qon<\/b>. Yurak qonni tomirlar orqali harakatlantirishga yordam beradi.<\/div>\n<\/div>\n\n<div class=\"grid\">\n<div class=\"card\">\n<h3>❤️ Yurakni ishga tushiring<\/h3>\n<div class=\"heart-scene\" id=\"heartScene\">\n<div class=\"vessel artery v1\"><\/div><div class=\"vessel artery v2\"><\/div>\n<div class=\"vessel vein v3\"><\/div><div class=\"vessel vein v4\"><\/div>\n<div class=\"heart\" id=\"heart\"><\/div>\n<div class=\"chamber c1\">O‘ng<br>bo‘lmacha<\/div><div class=\"chamber c2\">Chap<br>bo‘lmacha<\/div>\n<div class=\"chamber c3\">O‘ng<br>qorincha<\/div><div class=\"chamber c4\">Chap<br>qorincha<\/div>\n<\/div>\n<button class=\"btn red\" onclick=\"toggleHeart()\">❤️ Yurakni ishga tushirish<\/button>\n<button class=\"btn secondary\" onclick=\"resetHeart()\">↺ Qayta boshlash<\/button>\n<p id=\"heartMsg\" class=\"info\">Yurak qisqarib, qonni qon tomirlariga haydaydi. Keyin bo‘shashib, yana qon bilan to‘ladi.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h3>🩸 Qon tomirlari<\/h3>\n<div class=\"info\"><b>Arteriyalar<\/b> — qonni yurakdan olib chiqadi.<br><b>Venalar<\/b> — qonni yurakka olib keladi.<br><b>Kapillyarlar<\/b> — juda mayda tomirlar bo‘lib, qon va to‘qimalar o‘rtasida moddalar almashinuvida qatnashadi.<\/div>\n<p><b>Eslab qoling:<\/b> arteriya har doim kislorodli, vena har doim kislorodsiz qon olib yuradi, deb aytish noto‘g‘ri. Kichik qon aylanish doirasida bu holat teskari bo‘ladi.<\/p>\n<button class=\"btn purple\" onclick=\"toggleBlood()\">🩸 Qon aylanishini boshlash<\/button>\n<button class=\"btn secondary\" onclick=\"pauseBlood()\">⏸ Pauza<\/button>\n<button class=\"btn orange\" onclick=\"resetBlood()\">↺ Qayta boshlash<\/button>\n<p id=\"bloodMsg\" class=\"info\">Qizil va ko‘k ranglar bu simulyatsiyada kislorodga boy va kislorodga kambag‘al qonni shartli ifodalaydi.<\/p>\n<\/div>\n<\/div>\n\n<div class=\"card\">\n<h3>🩸 Qonning vazifalari<\/h3>\n<div class=\"grid\">\n<div class=\"info\">🔴 Kislorodni tashishda qatnashadi.<br>🟡 Karbonat angidridni olib ketishda qatnashadi.<br>🍎 Oziq moddalarni tashiydi.<\/div>\n<div class=\"info\">🧹 Moddalar almashinuvi mahsulotlarini tashishda qatnashadi.<br>🛡️ Organizmni himoya qilishda ishtirok etadi.<\/div>\n<\/div>\n<p><b>Eritrotsitlar<\/b> — qizil qon tanachalari. Ular tarkibidagi gemoglobin yordamida kislorodni tashishda muhim rol o‘ynaydi.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h3>❓ Topshiriq 3: Qaysi tomir qonni yurakdan olib chiqadi?<\/h3>\n<div class=\"options\" id=\"q2\"><\/div><div id=\"q2fb\" class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section id=\"s3\" class=\"section\">\n<div class=\"card\">\n<h2>🔗 Nafas va qon aylanish sistemalari qanday bog‘langan?<\/h2>\n<div class=\"info\"><b>Muammo:<\/b> “Biz nafas oldik. Kislorod organizmga kirdi. Endi kislorod tana hujayralariga qanday yetib boradi?”<\/div>\n<\/div>\n\n<div class=\"card\">\n<h3>▶️ Bitta uzluksiz jarayon<\/h3>\n<div class=\"progress\"><div id=\"mainProgress\"><\/div><\/div>\n<div class=\"steps\" id=\"mainSteps\"><\/div>\n<button class=\"btn green\" onclick=\"startMainProcess()\">▶ Jarayonni boshlash<\/button>\n<button class=\"btn secondary\" onclick=\"pauseMainProcess()\">⏸ Pauza<\/button>\n<button class=\"btn orange\" onclick=\"resetMainProcess()\">↺ Qayta boshlash<\/button>\n<div id=\"mainExplain\" class=\"info\">Jarayonni boshlang. Har bir bosqichda organizmda nima sodir bo‘layotganini kuzating.<\/div>\n<\/div>\n\n<div class=\"card\">\n<h3>🏃 Interaktiv tajriba: 1 daqiqa tez yugurdingiz<\/h3>\n<p>“Organizmda nima o‘zgaradi?”<\/p>\n<button class=\"btn red\" onclick=\"runExercise(true)\">🏃 Yugurishni boshlash<\/button>\n<button class=\"btn secondary\" onclick=\"runExercise(false)\">🧘 Dam olish<\/button>\n<div class=\"grid\" style=\"margin-top:12px\">\n<div class=\"info\"><b>❤️ Yurak:<\/b> <span id=\"heartState\">odatiy holat<\/span><\/div>\n<div class=\"info\"><b>🫁 Nafas:<\/b> <span id=\"breathState\">odatiy holat<\/span><\/div>\n<div class=\"info\"><b>💪 Mushaklarga ehtiyoj:<\/b> <span id=\"muscleState\">odatiy holat<\/span><\/div>\n<div class=\"info\"><b>🩸 Qon:<\/b> <span id=\"bloodState\">kislorodni tashiydi<\/span><\/div>\n<\/div>\n<p class=\"info\">Raqamlar berilmaydi: bu mashqdagi o‘zgarishlar sifat jihatdan ko‘rsatilmoqda. Haqiqiy yurak urishi va nafas olish tezligi odamga va sharoitga qarab farq qiladi.<\/p>\n<\/div>\n\n<div class=\"card\">\n<h3>🧩 Topshiriq 4: Moslashtiring<\/h3>\n<div class=\"match-grid\">\n<b>Burun<\/b><select class=\"match-select\" data-key=\"Burun\"><option value=\"\">Tanlang...<\/option><option>Havoni tozalash, isitish va namlashda yordam beradi<\/option><option>Qonni haydaydi<\/option><option>Qonni yurakka olib keladi<\/option><option>Gaz almashinuvi sodir bo‘ladi<\/option><\/select>\n<b>Yurak<\/b><select class=\"match-select\" data-key=\"Yurak\"><option value=\"\">Tanlang...<\/option><option>Havoni tozalash, isitish va namlashda yordam beradi<\/option><option>Qonni haydaydi<\/option><option>Qonni yurakka olib keladi<\/option><option>Gaz almashinuvi sodir bo‘ladi<\/option><\/select>\n<b>Vena<\/b><select class=\"match-select\" data-key=\"Vena\"><option value=\"\">Tanlang...<\/option><option>Havoni tozalash, isitish va namlashda yordam beradi<\/option><option>Qonni haydaydi<\/option><option>Qonni yurakka olib keladi<\/option><option>Gaz almashinuvi sodir bo‘ladi<\/option><\/select>\n<b>Alveola<\/b><select class=\"match-select\" data-key=\"Alveola\"><option value=\"\">Tanlang...<\/option><option>Havoni tozalash, isitish va namlashda yordam beradi<\/option><option>Qonni haydaydi<\/option><option>Qonni yurakka olib keladi<\/option><option>Gaz almashinuvi sodir bo‘ladi<\/option><\/select>\n<\/div>\n<button class=\"btn purple\" onclick=\"checkMatch()\">Javobni tekshirish<\/button>\n<div id=\"matchFb\" class=\"feedback\"><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>📝 Yakuniy test<\/h2>\n<div id=\"testBox\"><\/div>\n<button class=\"btn green\" onclick=\"submitTest()\">Testni yakunlash<\/button>\n<button class=\"btn secondary\" onclick=\"resetTest()\">Qayta ishlash<\/button>\n<div id=\"testResult\" class=\"result\" style=\"display:none;margin-top:12px\"><\/div>\n<\/div>\n\n<div class=\"card\">\n<h2>🌟 Xulosa<\/h2>\n<p>Nafas sistemasi organizmga kislorod kirishini va karbonat angidrid chiqarilishini ta’minlaydi. Qon aylanish sistemasi esa kislorodni va boshqa moddalarni tana bo‘ylab tashishda muhim rol o‘ynaydi. Shu sababli nafas olish va qon aylanish sistemalari organizmni kislorod bilan ta’minlashda birgalikda ishlaydi.<\/p>\n<\/div>\n<\/section>\n<\/main>\n\n<div class=\"footer-nav\">\n<button class=\"btn secondary\" onclick=\"prevSection()\">← Orqaga<\/button>\n<button class=\"btn\" onclick=\"nextSection()\">Keyingi →<\/button>\n<button class=\"btn orange\" onclick=\"restartAll()\">↺ Barchasini qayta boshlash<\/button>\n<\/div>\n<\/div>\n\n<script>\nconst organData=[\n[\"Burun bo‘shlig‘i\",\"Havo organizmga asosan burun orqali kiradi. Burun bo‘shlig‘ida havo tozalanadi, isitiladi va namlanadi. Burun tukchalari changning bir qismini ushlab qoladi.\"],\n[\"Halqum\",\"Havo burun bo‘shlig‘idan keyin halqum orqali nafas yo‘llariga o‘tadi.\"],\n[\"Hiqildoq\",\"Havo hiqildoq orqali traxeyaga o‘tadi. Hiqildoq tovush hosil bo‘lishida ham ishtirok etadi.\"],\n[\"Traxeya\",\"Havoni o‘pkaga tomon olib boradigan nafas yo‘li. Traxeya keyinchalik ikkita asosiy bronxga bo‘linadi.\"],\n[\"Bronxlar\",\"Bronxlar traxeyadan o‘ng va chap o‘pkaga kiradi va mayda bronxchalarga tarmoqlanadi.\"],\n[\"O‘pka\",\"Nafas olish sistemasining asosiy organlaridan biri. Gaz almashinuvi o‘pkadagi alveolalar bilan bog‘liq.\"],\n[\"Alveolalar\",\"O‘pka ichidagi juda mayda havo pufakchalari. Ular atrofidagi kapillyarlar bilan gaz almashinuvida qatnashadi: kislorod qonga, karbonat angidrid esa alveolaga o‘tadi.\"]\n];\nconst organs=document.getElementById(\"organs\");\norganData.forEach((x,i)=>{let b=document.createElement(\"button\");b.className=\"organ\";b.textContent=x[0];b.onclick=()=>{document.querySelectorAll(\".organ\").forEach(a=>a.classList.remove(\"selected\"));b.classList.add(\"selected\");document.getElementById(\"organInfo\").innerHTML=\"<b>\"+x[0]+\"<\/b><br>\"+x[1]};organs.appendChild(b)});\n\nfunction breathe(dir){\n const scene=document.getElementById(\"lungScene\");\n document.querySelectorAll(\".air\").forEach(x=>x.remove());\n const a=document.createElement(\"div\");a.className=\"air \"+(dir===\"in\"?\"in\":\"out\");scene.appendChild(a);\n document.querySelectorAll(\".lung\").forEach(x=>x.classList.toggle(\"breathe\",dir===\"in\"));\n document.getElementById(\"breathMsg\").innerHTML=dir===\"in\"?\"<b>Nafas olish:<\/b> havo burun → halqum → hiqildoq → traxeya → bronxlar → o‘pkaga boradi. O‘pka kengayadi.\":\"<b>Nafas chiqarish:<\/b> havo o‘pkadan → bronxlar → traxeya → hiqildoq → halqum → burun orqali tashqariga chiqadi. O‘pka kichrayadi.\";\n}\nfunction resetBreath(){document.querySelectorAll(\".air\").forEach(x=>x.remove());document.querySelectorAll(\".lung\").forEach(x=>x.classList.remove(\"breathe\"));document.getElementById(\"breathMsg\").textContent=\"Nafas olishda havo burun orqali kirib, nafas yo‘llari orqali o‘pkaga boradi.\"}\n\nconst seqItems=[\"Burun\",\"Halqum\",\"Hiqildoq\",\"Traxeya\",\"Bronxlar\",\"O‘pka\"];\nlet seqPos=0;\nfunction buildSeq(){let box=document.getElementById(\"seq1\");box.innerHTML=\"\";seqItems.slice().sort(()=>Math.random()-.5).forEach(x=>{let b=document.createElement(\"button\");b.className=\"seq-item\";b.textContent=x;b.onclick=()=>sequenceClick(x,b);box.appendChild(b)})}\nfunction sequenceClick(x,b){if(x===seqItems[seqPos]){b.classList.add(\"used\");seqPos++;if(seqPos===seqItems.length){showFb(\"seqResult\",true,\"To‘g‘ri! Havo nafas yo‘llari bo‘ylab o‘pkaga yetib boradi.\")}}else showFb(\"seqResult\",false,\"Hozir <b>\"+seqItems[seqPos]+\"<\/b> bo‘lishi kerak.\");}\nfunction showFb(id,ok,msg){let e=document.getElementById(id);e.className=\"feedback show\";e.style.background=ok?\"#dcfce7\":\"#fee2e2\";e.style.color=ok?\"#166534\":\"#991b1b\";e.innerHTML=msg}\nbuildSeq();\n\nfunction question(container,fb,opts,correct,explain){\nlet c=document.getElementById(container);c.innerHTML=\"\";\nopts.forEach((o,i)=>{let b=document.createElement(\"button\");b.className=\"option\";b.textContent=o;b.onclick=()=>{c.querySelectorAll(\"button\").forEach(x=>x.disabled=true);if(i===correct){b.classList.add(\"correct\");showFb(fb,true,\"<b>To‘g‘ri!<\/b> \"+explain)}else{b.classList.add(\"wrong\");showFb(fb,false,\"<b>Xato.<\/b> To‘g‘ri javob: <b>\"+opts[correct]+\"<\/b>. \"+explain)}};c.appendChild(b)})\n}\nquestion(\"q1\",\"q1fb\",[\"A) Kislorod\",\"B) Karbonat angidrid\",\"C) Suv bug‘i\",\"D) Azot\"],0,\"Kislorod alveolalardan qonga o‘tadi.\");\nquestion(\"q2\",\"q2fb\",[\"A) Arteriya\",\"B) Vena\",\"C) Kapillyar\"],0,\"Arteriyalar qonni yurakdan olib chiqadi.\");\n\nlet heartOn=false,bloodOn=false;\nfunction toggleHeart(){heartOn=!heartOn;document.getElementById(\"heart\").classList.toggle(\"beat\",heartOn);document.getElementById(\"heartMsg\").innerHTML=heartOn?\"<b>Yurak ishlamoqda:<\/b> qisqarish → qonning tomirlarga haydalishi → bo‘shashish → yana to‘lish jarayoni takrorlanadi.\":\"Yurak animatsiyasi to‘xtatildi.\"}\nfunction resetHeart(){heartOn=false;document.getElementById(\"heart\").classList.remove(\"beat\");document.getElementById(\"heartMsg\").textContent=\"Yurak qisqarib, qonni qon tomirlariga haydaydi. Keyin bo‘shashib, yana qon bilan to‘ladi.\"}\nfunction toggleBlood(){bloodOn=true;document.querySelectorAll(\".vessel\").forEach(v=>{v.innerHTML=\"\";for(let i=0;i<3;i++){let d=document.createElement(\"i\");d.className=\"bloodDot \"+(v.classList.contains(\"artery\")?\"rDot\":\"bDot\")+\" flow\";d.style.left=(20+i*35)+\"px\";d.style.top=\"1px\";v.appendChild(d)}});document.getElementById(\"bloodMsg\").textContent=\"Qon tomirlari bo‘ylab qon harakati boshlandi. Ranglar shartli tushuntirish vositasidir.\"}\nfunction pauseBlood(){bloodOn=false;document.querySelectorAll(\".bloodDot\").forEach(d=>d.style.animationPlayState=\"paused\");document.getElementById(\"bloodMsg\").textContent=\"Qon harakati pauzaga qo‘yildi.\"}\nfunction resetBlood(){bloodOn=false;document.querySelectorAll(\".vessel\").forEach(v=>v.innerHTML=\"\");document.getElementById(\"bloodMsg\").textContent=\"Qizil va ko‘k ranglar bu simulyatsiyada kislorodga boy va kislorodga kambag‘al qonni shartli i
