fodalaydi.\"}\n\nconst steps=[\n\"Inson nafas oladi. Havo o‘pka alveolalarigacha boradi.\",\n\"Alveolalarda gaz almashinuvi sodir bo‘ladi: kislorod alveoladan qonga o‘tadi.\",\n\"Kislorod qizil qon tanachalari yordamida tashiladi.\",\n\"Yurak kislorodga boy qonni tana bo‘ylab haydaydi.\",\n\"Qon kislorodni tana hujayralariga yetkazadi.\",\n\"Hujayralarda energiya hosil bo‘lish jarayonlarida kisloroddan foydalaniladi.\",\n\"Hujayralarda hosil bo‘lgan karbonat angidrid qonga o‘tadi.\",\n\"Qon karbonat angidridni o‘pkaga olib keladi.\",\n\"Karbonat angidrid alveolalarga o‘tadi.\",\n\"Nafas chiqarish vaqtida karbonat angidrid tashqariga chiqariladi.\"\n];\nconst mainSteps=document.getElementById(\"mainSteps\");\nsteps.forEach((s,i)=>{let d=document.createElement(\"div\");d.className=\"step\";d.innerHTML=\"<b>\"+(i+1)+\"-bosqich<\/b> — \"+s;mainSteps.appendChild(d)});\nlet mainTimer=null,mainIndex=0;\nfunction startMainProcess(){if(mainTimer)return;runMainStep();mainTimer=setInterval(runMainStep,1800)}\nfunction runMainStep(){let ss=document.querySelectorAll(\"#mainSteps .step\");ss.forEach(x=>x.classList.remove(\"active\"));if(mainIndex>=steps.length){clearInterval(mainTimer);mainTimer=null;document.getElementById(\"mainExplain\").innerHTML=\"<b>Jarayon tugadi.<\/b> Nafas va qon aylanish sistemalari birgalikda ishladi.\";return}ss[mainIndex].classList.add(\"active\");document.getElementById(\"mainExplain\").textContent=steps[mainIndex];document.getElementById(\"mainProgress\").style.width=((mainIndex+1)/steps.length*100)+\"%\";mainIndex++}\nfunction pauseMainProcess(){if(mainTimer){clearInterval(mainTimer);mainTimer=null}document.getElementById(\"mainExplain\").textContent=\"Jarayon pauzada. “Jarayonni boshlash”ni bossangiz davom etadi.\"}\nfunction resetMainProcess(){if(mainTimer){clearInterval(mainTimer);mainTimer=null}mainIndex=0;document.querySelectorAll(\"#mainSteps .step\").forEach(x=>x.classList.remove(\"active\"));document.getElementById(\"mainProgress\").style.width=\"0\";document.getElementById(\"mainExplain\").textContent=\"Jarayonni boshlang. Har bir bosqichda organizmda nima sodir bo‘layotganini kuzating.\"}\n\nfunction runExercise(active){document.getElementById(\"heartState\").textContent=active?\"tezroq ishlaydi\":\"asta-sekin odatdagi holatga qaytadi\";document.getElementById(\"breathState\").textContent=active?\"tezroq nafas olinadi\":\"asta-sekin odatdagi holatga qaytadi\";document.getElementById(\"muscleState\").textContent=active?\"ko‘proq kislorod kerak bo‘ladi\":\"kislorodga ehtiyoj kamayadi\";document.getElementById(\"bloodState\").textContent=active?\"kislorodni mushaklarga yetkazadi\":\"kislorod tashishni davom ettiradi\";document.getElementById(\"heart\").classList.toggle(\"beat\",active)}\n\nconst correctMatch={Burun:\"Havoni tozalash, isitish va namlashda yordam beradi\",Yurak:\"Qonni haydaydi\",Vena:\"Qonni yurakka olib keladi\",Alveola:\"Gaz almashinuvi sodir bo‘ladi\"};\nfunction checkMatch(){let ok=0;document.querySelectorAll(\".match-select\").forEach(s=>{if(s.value===correctMatch[s.dataset.key])ok++});showFb(\"matchFb\",ok===4,ok===4?\"Ajoyib! 4/4 moslashtirish to‘g‘ri.\":\"Hozircha \"+ok+\"/4 to‘g‘ri. Har bir organ yoki tomirning vazifasini qayta o‘qing.\");}\n\nconst testQs=[\n[\"Nafas olish sistemasining asosiy vazifasi nima?\",[\"Organizmga kislorod kirishini va karbonat angidrid chiqishini ta’minlash\",\"Faqat ovqatni hazm qilish\",\"Faqat qonni haydash\",\"Suyaklarni mustahkamlash\"],0],\n[\"Havo organizmga asosan qaysi organ orqali kiradi?\",[\"Yurak\",\"Burun\",\"Oshqozon\",\"Buyrak\"],1],\n[\"Traxeya nimaga xizmat qiladi?\",[\"Havoni o‘pkaga tomon olib boradigan nafas yo‘li\",\"Qonni filtrlash\",\"Oziq moddani hazm qilish\",\"Qonni yurakka olib kelish\"],0],\n[\"Gaz almashinuvi asosan qayerda sodir bo‘ladi?\",[\"Oshqozonda\",\"Yurakda\",\"Alveolalar va kapillyarlar orasida\",\"Burun tuklarida\"],2],\n[\"Yurakning asosiy vazifasi nima?\",[\"Qonni harakatlantirishga yordam berish\",\"Havoni isitish\",\"Oziqni parchalash\",\"Tovush chiqarish\"],0],\n[\"Arteriya va venaning asosiy farqi nima?\",[\"Arteriya qonni yurakdan olib chiqadi, vena yurakka olib keladi\",\"Arteriya faqat ko‘k, vena faqat qizil\",\"Ikkalasi ham faqat havoni tashiydi\",\"Arteriya yurakni, vena o‘pkani hosil qiladi\"],0],\n[\"Qizil qon tanachalarining kislorod tashishdagi roli qanday?\",[\"Gemoglobin yordamida kislorod tashishda muhim rol o‘ynaydi\",\"Faqat ovqatni hazm qiladi\",\"O‘pkani kengaytiradi\",\"Yurak klapanini boshqaradi\"],0],\n[\"Nafas sistemasi va qon aylanish sistemasi qanday bog‘langan?\",[\"O‘pkadagi kislorod qonga o‘tadi va qon uni tana bo‘ylab tashiydi\",\"Ular bir-biriga bog‘liq emas\",\"Yurak havoni alveolaga yuboradi\",\"Qon burun orqali tashqariga chiqadi\"],0]\n];\nfunction buildTest(){let box=document.getElementById(\"testBox\");box.innerHTML=\"\";testQs.forEach((q,i)=>{let d=document.createElement(\"div\");d.className=\"card\";d.style.marginBottom=\"10px\";d.innerHTML=\"<b>\"+(i+1)+\". \"+q[0]+\"<\/b><div class='options' style='margin-top:8px'>\"+q[1].map((o,j)=>\"<label class='option'><input type='radio' name='t\"+i+\"' value='\"+j+\"'> \"+o+\"<\/label>\").join(\"\")+\"<\/div>\";box.appendChild(d)})}\nfunction submitTest(){let score=0;testQs.forEach((q,i)=>{let v=document.querySelector(\"input[name=t\"+i+\"]:checked\");if(v&&+v.value===q[2])score++});let msg=score===8?\"8/8 — A’lo!\":score>=6?\"6–7 — Juda yaxshi!\":score>=4?\"4–5 — Yaxshi, lekin mavzuni yana takrorlash kerak.\":\"0–3 — Mavzuni qayta o‘rganing.\";let r=document.getElementById(\"testResult\");r.style.display=\"block\";r.textContent=msg+\" Natijangiz: \"+score+\"/8.\";r.scrollIntoView({behavior:\"smooth\",block:\"center\"})}\nfunction resetTest(){buildTest();document.getElementById(\"testResult\").style.display=\"none\"}\n\nlet current=1;\nfunction showSection(n){current=n;document.querySelectorAll(\".section\").forEach((s,i)=>s.classList.toggle(\"active\",i===n-1));document.querySelectorAll(\".tab\").forEach((t,i)=>t.classList.toggle(\"active\",i===n-1));window.scrollTo({top:0,behavior:\"smooth\"})}\nfunction nextSection(){showSection(Math.min(3,current+1))}\nfunction prevSection(){showSection(Math.max(1,current-1))}\nfunction restartAll(){resetBreath();resetHeart();resetBlood();resetMainProcess();seqPos=0;buildSeq();resetTest();document.querySelectorAll(\".match-select\").forEach(s=>s.value=\"\");document.getElementById(\"matchFb\").className=\"feedback\";showSection(1)}\n\nbuildTest();\n<\/script>\n<\/body>\n<\/html>"}, {"icon": "🌿", "title": "Oziq zanjiri", "html": "<!DOCTYPE html>\n<html lang=\"uz\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Oziq zanjiri va oziq to‘ri — 6-sinf Tabiiy fanlar<\/title>\n<style>\n:root{--bg:#eef7e8;--ink:#1d3a2a;--g:#2e9e4f;--lg:#8fd14f;--sun:#ffc93c;--org:#f08a24;--red:#e5534b;--blue:#3b8fd9;--card:#fff}\n*{box-sizing:border-box}\nbody{margin:0;font-family:system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}\nheader{background:linear-gradient(120deg,#2e9e4f,#8fd14f 60%,#ffc93c);color:#fff;text-align:center;padding:26px 14px;text-shadow:0 2px 4px #0003}\nheader h1{margin:0 0 4px;font-size:clamp(1.5rem,5vw,2.4rem)}header p{margin:0}\nnav{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:#fff;padding:8px;box-shadow:0 2px 8px #0002}\nnav a{padding:7px 14px;border-radius:20px;background:#e3f3da;color:var(--ink);text-decoration:none;font-weight:700;font-size:.88rem}\nnav a:hover{background:var(--sun)}\nmain{max-width:920px;margin:auto;padding:10px}\nsection{background:var(--card);border-radius:20px;padding:18px;margin:18px 0;box-shadow:0 4px 18px #2e9e4f26}\nh2{margin-top:0;color:var(--g)}h3{color:var(--blue);margin-bottom:6px}\n.def{background:#fff8dc;border-left:6px solid var(--sun);border-radius:10px;padding:10px 14px;margin:10px 0}\nbutton{font:inherit;font-weight:700;border:0;border-radius:14px;padding:10px 16px;color:#fff;background:var(--blue);cursor:pointer;transition:transform .15s,filter .15s}\nbutton:hover{filter:brightness(1.1);transform:translateY(-2px)}button:active{transform:scale(.95)}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.bg{background:var(--g)}.bo{background:var(--org)}.br{background:var(--red)}.bx{background:#7d8c85}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.msg{background:#eef8f2;border-radius:12px;padding:10px 14px;margin-top:10px;min-height:52px;font-weight:600}\n.chain{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px;margin:12px 0;min-height:90px}\n.org{width:62px;height:70px;border-radius:16px;background:#f3fbea;border:3px solid #cfe9b8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;cursor:pointer;padding:0;color:var(--ink);transition:transform .2s,border-color .2s}\n.org small{font-size:.62rem;font-weight:700;line-height:1}\n.org:hover,.org.sel{border-color:var(--org);transform:scale(1.1);filter:none}\n.arr{font-size:1.5rem;color:var(--org);font-weight:800;transform-origin:left}\n.slots .org{background:#fff;border-style:dashed}\n.slots .org.full{border-style:solid;background:#f3fbea}\n.pool .org{background:#fff3d6;border-color:#f5d78a}\n.pop{animation:pop .6s}@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}\n.shake{animation:shake .5s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}\n.web{width:100%;height:auto;background:linear-gradient(#e6f5fd,#eaf7da 60%);border-radius:16px;border:2px solid #d3ebc6;touch-action:manipulation}\n.nd{cursor:pointer}.nd circle{fill:#fff;stroke:#7fbf5a;stroke-width:3;transition:all .3s}\n.nd:hover circle,.nd.sel circle{stroke:var(--org);stroke-width:5}\n.nd.gone{opacity:.2;filter:grayscale(1)}\n.edge{stroke:#6b8f5a;stroke-width:3;fill:none;stroke-dasharray:7 6;animation:flow 1s linear infinite;transition:opacity .4s,stroke .4s}\n@keyframes flow{to{stroke-dashoffset:-13}}\n.edge.dim{opacity:.08}.edge.hid{opacity:0}\n.bdg{font-size:20px;font-weight:800}\n.eco{display:grid;gap:8px;margin:10px 0}\n.eb{display:grid;grid-template-columns:96px 1fr 38px;align-items:center;gap:8px;font-weight:700}\n.eb div.t{height:22px;background:#e2ece0;border-radius:11px;overflow:hidden}\n.eb i{display:block;height:100%;border-radius:11px;transition:width 1s}\n.opts{display:grid;gap:8px;margin:8px 0}\n.opt{background:#f1f8ff;color:var(--ink);border:2px solid #b9d9f5;text-align:left}\n.opt.ok{background:#c9f0d3;border-color:var(--g)}.opt.no{background:#ffd6d3;border-color:var(--red)}\n.qq{background:#f8fcf4;border-radius:14px;padding:12px;margin:12px 0}\n.fb{min-height:28px;font-weight:700;margin-top:6px}\n.res{font-size:1.2rem;font-weight:800;text-align:center;padding:14px;border-radius:14px;background:#fff3d6;margin-top:10px}\nfooter{text-align:center;padding:18px;color:#5b7566;font-size:.9rem}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<header><h1>🌿 Oziq zanjiri va oziq to‘ri<\/h1><p>6-sinf «Tabiiy fanlar» — interaktiv dars-simulyatsiya<\/p><\/header>\n<nav><a href=\"#b1\">1. Zanjir va to‘r<\/a><a href=\"#b2\">2. Tabiatdagi o‘rni<\/a><a href=\"#b3\">3. Interaktiv oziq to‘ri<\/a><\/nav>\n<main>\n\n<section id=\"b1\">\n<h2>1. Oziq zanjiri va oziq to‘ri<\/h2>\n<div class=\"def\"><b>Oziq zanjiri<\/b> — tabiatdagi organizmlarning oziqlanish orqali bir-biri bilan bog‘lanish ketma-ketligidir. Strelka oziqa kimdan kimga o‘tishini ko‘rsatadi.<\/div>\n<div class=\"row\"><button class=\"bg\" id=\"bPlay\">▶ Animatsiyani boshlash<\/button><\/div>\n<div class=\"chain\" id=\"chain1\"><\/div>\n<div class=\"msg\" id=\"chMsg\">Organizmni bosing — uning o‘rni haqida ma’lumot chiqadi.<\/div>\n\n<h3>🧩 Topshiriq: «Oziq zanjirini tuz»<\/h3>\n<p>Organizmlarni bosib, to‘g‘ri tartibda joylashtiring (birinchi — o‘t). Joylashtirilganni qaytarish uchun uni bosing.<\/p>\n<div class=\"chain pool\" id=\"pool\"><\/div>\n<div class=\"chain slots\" id=\"slots\"><\/div>\n<div class=\"row\"><button class=\"bx\" id=\"bPuz\">↺ Qaytadan<\/button><\/div>\n<div class=\"msg\" id=\"puzMsg\">Zanjirni tuzing.<\/div>\n\n<h3>🕸 Oziq to‘ri<\/h3>\n<div class=\"def\"><b>Oziq to‘ri<\/b> — bir nechta oziq zanjirlarining o‘zaro bog‘lanishidan hosil bo‘lgan oziqlanish aloqalaridir.<\/div>\n<div class=\"row\"><button class=\"bo\" id=\"bWeb1\">🔗 Zanjirlarni birlashtir<\/button><\/div>\n<svg class=\"web\" id=\"web1\" viewBox=\"0 0 600 390\"><\/svg>\n<div class=\"msg\" id=\"web1Msg\">Tugmani bosing: uchta zanjir birin-ketin chiziladi va bir-biriga ulanadi.<\/div>\n<\/section>\n\n<section id=\"b2\">\n<h2>2. Oziq zanjirining tabiatdagi o‘rni<\/h2>\n<p>Oziq zanjiri orqali <b>energiya<\/b> organizmlar orasida o‘tadi, organizmlar bir-biri bilan bog‘lanadi va ekotizimda muvozanat saqlanadi. Bir organizm soni o‘zgarsa, boshqalarga ham ta’sir qiladi.<\/p>\n<div class=\"eco\" id=\"eco\"><\/div>\n<div class=\"row\"><button class=\"bg\" id=\"eN\">⚖ Odatdagi holat<\/button><button class=\"bo\" id=\"eR\">🐇 Quyonlar kamaydi<\/button><button class=\"br\" id=\"eF\">🦊 Tulkilar kamaydi<\/button><\/div>\n<div class=\"msg\" id=\"ecoMsg\">Tugmalardan birini bosing.<\/div>\n<h3>❓ Savol<\/h3>\n<div id=\"q2\"><\/div>\n<\/section>\n\n<section id=\"b3\">\n<h2>3. Interaktiv oziq to‘ri<\/h2>\n<p>Organizmni bosing — ma’lumot chiqadi. Strelkalar oziqa va energiya yo‘nalishini ko‘rsatadi.<\/p>\n<svg class=\"web\" id=\"web3\" viewBox=\"0 0 600 390\"><\/svg>\n<div class=\"msg\" id=\"orgInfo\">Organizmni tanlang 👆<\/div>\n<div class=\"row\"><button class=\"br\" id=\"bRem\">🚫 Ekotizimdan olib tashlash<\/button><button class=\"bg\" id=\"bRes\">🔄 Ekotizimni tiklash<\/button><\/div>\n<div class=\"msg\" id=\"remMsg\">Avval organizmni tanlang, so‘ng «olib tashlash»ni bosing.<\/div>\n<h3>📝 Topshiriqlar<\/h3><div id=\"q3\"><\/div>\n<h3>🏁 Yakuniy test<\/h3><div id=\"qf\"><\/div><div class=\"res\" id=\"final\" hidden><\/div>\n<\/section>\n<\/main>\n<footer>6-sinf «Tabiiy fanlar» • Oziq zanjiri va oziq to‘ri<\/footer>\n\n<script>\nconst $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst O={\ngrass:{e:'🌱',n:'O‘t',x:150,y:325,role:'ishlab chiqaruvchi. U Quyosh nuri yordamida o‘zi oziq hosil qiladi.'},\ngrain:{e:'🌾',n:'Don',x:470,y:325,role:'ishlab chiqaruvchi o‘simlik. Uning donini hayvonlar yeydi.'},\ngrasshopper:{e:'🦗',n:'Chigirtka',x:60,y:225,role:'o‘simlik bilan oziqlanuvchi birlamchi iste’molchi.'},\nrabbit:{e:'🐇',n:'Quyon',x:235,y:225,role:'o‘simlik bilan oziqlanuvchi birlamchi iste’molchi.'},\nmouse:{e:'🐭',n:'Sichqon',x:470,y:225,role:'don bilan oziqlanuvchi birlamchi iste’molchi.'},\nfrog:{e:'🐸',n:'Qurbaqa',x:60,y:120,role:'chigirtka bilan oziqlanuvchi iste’molchi.'},\nsnake:{e:'🐍',n:'Ilon',x:350,y:120,role:'boshqa hayvonlar bilan oziqlanuvchi iste’molchi.'},\nfox:{e:'🦊',n:'Tulki',x:235,y:35,role:'quyon bilan oziqlanuvchi yirtqich.'},\neagle:{e:'🦅',n:'Burgut',x:450,y:35,role:'oziq zanjirining yuqori pog‘onalaridan birida turuvchi yirtqich.'}};\nconst E=[['grass','grasshopper'],['grass','rabbit'],['grain','mouse'],['grasshopper','frog'],['frog','snake'],['mouse','snake'],['rabbit','fox'],['snake','eagle'],['mouse','eagle']];\nconst CH=['grass','grasshopper','frog','snake','eagle'];\nconst info=k=>`${O[k].e} <b>${O[k].n}<\/b> — ${O[k].role}`;\n\n/* ---- 1: zanjir animatsiyasi ---- */\nconst ch=$('chain1');let els=[],arrs=[];\nCH.forEach((k,i)=>{const b=document.createElement('button');b.className='org';b.innerHTML=`${O[k].e}<small>${O[k].n}<\/small>`;\n b.onclick=()=>{els.forEach(x=>x.classList.remove('sel'));b.classList.add('sel');$('chMsg').innerHTML=info(k)};els.push(b);ch.appendChild(b);\n if(i<4){const a=document.createElement('span');a.className='arr';a.textContent='➜';arrs.push(a);ch.appendChild(a)}});\nlet run=0;\nasync function playChain(){const id=++run;els.forEach(x=>x.style.opacity=0);arrs.forEach(x=>x.style.opacity=0);\n for(let i=0;i<5;i++){if(id!==run)return;\n  els[i].style.opacity=1;els[i].animate([{transform:'translateX(60px) scale(.5)'},{transform:'none'}],{duration:700,easing:'ease-out'});\n  if(i>0){arrs[i-1].style.opacity=1;arrs[i-1].animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:500})}\n  $('chMsg').innerHTML=i?`${O[CH[i]].e} ${O[CH[i]].n} ${O[CH[i-1]].e} ${O[CH[i-1]].n} tomon harakatlandi — oziqa shu yo‘nalishda o‘tadi.`:'🌱 Avval o‘t paydo bo‘ldi — u zanjirning boshi.';\n  await sleep(1000)}\n $('chMsg').textContent='✅ Zanjir tayyor. Endi har bir organizmni bosib ko‘ring.'}\n$('bPlay').onclick=playChain;\n\n/* ---- topshiriq: zanjir tuz ---- */\nconst mix=['frog','grass','eagle','snake','grasshopper'];let slot=[];\nfunction drawPuz(){const p=$('pool'),s=$('slots');p.innerHTML='';s.innerHTML='';\n mix.forEach(k=>{const b=document.createElement('button');b.className='org';b.innerHTML=`${O[k].e}<small>${O[k].n}<\/small>`;\n  if(slot.includes(k))b.style.visibility='hidden';b.onclick=()=>{if(slot.length<5){slot.push(k);drawPuz();check()}};p.appendChild(b)});\n for(let i=0;i<5;i++){const b=document.createElement('button');b.className='org slots';const k=slot[i];\n  if(k){b.className='org full';b.innerHTML=`${O[k].e}<small>${O[k].n}<\/small>`;b.onclick=()=>{slot.splice(i);drawPuz();$('puzMsg').textContent='Zanjirni tuzing.'}}else b.innerHTML='<small>?<\/small>';\n  s.appendChild(b);if(i<4){const a=document.createElement('span');a.className='arr';a.textContent='➜';s.appendChild(a)}}}\nfunction check(){if(slot.length<5)return;const ok=slot.every((k,i)=>k===CH[i]),m=$('puzMsg');m.className='msg '+(ok?'pop':'shake');\n m.textContent=ok?'🎉 Ajoyib! Oziq zanjiri to‘g‘ri tuzildi!':'🔎 Yana bir bor o‘ylab ko‘r. Organizm kim bilan oziqlanishini aniqlashga harakat qil.'}\n$('bPuz').onclick=()=>{slot=[];drawPuz();$('puzMsg').className='msg';$('puzMsg').textContent='Zanjirni tuzing.'};drawPuz();\n\n/* ---- oziq to'ri chizish ---- */\nconst NS='http://www.w3.org/2000/svg';\nfunction mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}\nfunction web(svg,edges,keys,onClick){const id='m'+svg.id;\n const d=mk('defs',{},svg);const m=mk('marker',{id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},d);mk('path',{d:'M0 0L10 5L0 10z',fill:'#e07a1f'},m);\n const es={},ns={};\n edges.forEach(([a,b])=>{const A=O[a],B=O[b],dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy),u=dx/L,v=dy/L;\n  es[a+b]=mk('line',{class:'edge',x1:A.x+u*32,y1:A.y+v*32,x2:B.x-u*36,y2:B.y-v*36,'marker-end':`url(#${id})`},svg)});\n keys.forEach(k=>{const o=O[k],g=mk('g',{class:'nd','data-k':k,tabindex:0},svg);mk('circle',{cx:o.x,cy:o.y,r:28},g);\n  const t=mk('text',{x:o.x,y:o.y+11,'text-anchor':'middle','font-size':30},g);t.textContent=o.e;\n  const l=mk('text',{x:o.x,y:o.y+46,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'#1d3a2a'},g);l.textContent=o.n;\n  const bd=mk('text',{x:o.x+24,y:o.y-18,class:'bdg','text-anchor':'middle'},g);\n  g.onclick=()=>onClick&&onClick(k);ns[k]=g});\n return{es,ns}}\n/* 1-bo'lim to'ri */\nconst W1=web($('web1'),E,Object.keys(O),k=>{$('web1Msg').innerHTML=info(k)});\nObject.values(W1.es).forEach(e=>e.classList.add('hid'));\nconst CE=[[['grass','rabbit'],['rabbit','fox']],[['grass','grasshopper'],['grasshopper','frog'],['frog','snake']],[['grain','mouse'],['mouse','snake']]];\nconst COL=['#e07a1f','#2b8fd6','#9b45c9'];let wb=false;\n$('bWeb1').onclick=async()=>{if(wb)return;wb=true;Object.values(W1.es).forEach(e=>{e.classList.add('hid');e.style.stroke=''});\n const nm=['🌱 O‘t → 🐇 Quyon → 🦊 Tulki','🌱 O‘t → 🦗 Chigirtka → 🐸 Qurbaqa → 🐍 Ilon','🌾 Don → 🐭 Sichqon → 🐍 Ilon'];\n for(let c=0;c<3;c++){$('web1Msg').textContent='Zanjir: '+nm[c];for(const [a,b] of CE[c]){const e=W1.es[a+b];e.style.stroke=COL[c];e.classList.remove('hid');await sleep(700)}await sleep(500)}\n $('web1Msg').textContent='Zanjirlar o‘zaro bog‘landi. 🕸 Endi qolgan aloqalar ham paydo bo‘ladi...';await sleep(1000);\n Object.values(W1.es).forEach(e=>{e.classList.remove('hid');e.style.stroke=''});\n $('web1Msg').textContent='✅ Natija: oziq to‘ri! Bu yerda ilonni qurbaqa ham, sichqon ham oziqlantiradi. Organizmni bosib ko‘ring.';wb=false};\n\n/* ---- 2: ekotizim ---- */\nconst ec=[['🌱 O‘t','#5cc04a',150],['🐇 Quyon','#f0a030',50],['🦊 Tulki','#e5534b',20]];const eb=[];\nec.forEach(r=>{const d=document.createElement('div');d.className='eb';d.innerHTML=`<span>${r[0]}<\/span><div class=\"t\"><i style=\"background:${r[1]}\"><\/i><\/div><b><\/b>`;$('eco').appendChild(d);eb.push(d)});\nfunction setEco(v){v.forEach((x,i)=>{eb[i].querySelector('i').style.width=Math.min(100,x/ec[i][2]*100)+'%';eb[i].querySelector('b').textContent=x})}\nsetEco([100,30,10]);let et=0;\nasync function eplay(steps){const id=++et;for(const s of steps){if(id!==et)return;setEco(s[0]);$('ecoMsg').innerHTML=s[1];await sleep(1700)}}\nconst XUL='<br>💡 <b>Bir organizm sonining o‘zgarishi oziq zanjiridagi boshqa organizmlarga ham ta’sir qilishi mumkin.<\/b>';\n$('eN').onclick=()=>eplay([[[100,30,10],'⚖ Odatdagi holat: o‘t — 100, quyon — 30, tulki — 10.']]);\n$('eR').onclick=()=>eplay([[[100,12,10],'1-bosqich: 🐇 quyonlar kamaydi.'],[[140,12,10],'2-bosqich: 🌱 quyonlar kam yeydi, o‘tlar ko‘payadi.'],[[140,12,5],'3-bosqich: 🦊 tulkilarga oziqa yetmaydi, ularning soni kamayishi mumkin.'+XUL]]);\n$('eF').onclick=()=>eplay([[[100,30,4],'1-bosqich: 🦊 tulkilar kamaydi.'],[[100,48,4],'2-bosqich: 🐇 quyonlarni yeydigan tulki kam, quyonlar ko‘payadi.'],[[60,48,4],'3-bosqich: 🌱 quyonlar ko‘p yeydi, o‘tlar kamayadi.'+XUL]]);\n\n/* ---- viktorina ---- */\nfunction quiz(el,qs,done){let n=0,sc=0;qs.forEach((q,i)=>{const d=document.createElement('div');d.className='qq';d.innerHTML=`<b>${i+1}. ${q.q}<\/b>`;\n const ob=document.createElement('div');ob.className='opts';const fb=document.createElement('div');fb.className='fb';\n q.o.forEach((t,j)=>{const b=document.createElement('button');b.className='opt';b.textContent='ABC'[j]+') '+t;\n  b.onclick=()=>{if(d.dataset.d)return;d.dataset.d=1;const ok=j===q.a;b.classList.add(ok?'ok':'no');ob.children[q.a].classList.add('ok');\n   fb.className='fb '+(ok?'pop':'shake');fb.style.color=ok?'#1e8e4a':'#d4443c';fb.textContent=(ok?'✅ To‘g‘ri! ':'❌ Noto‘g‘ri. Yana bir bor o‘ylab ko‘r! ')+(q.e||'');\n   n++;if(ok)sc++;if(n===qs.length&&done)done(sc)};ob.appendChild(b)});\n d.append(ob,fb);el.appendChild(d)})}\nquiz($('q2'),[{q:'Quyonlar juda ko‘payib ketsa, nima bo‘lishi mumkin?',o:['O‘tlar kamayishi mumkin.','O‘tlar doimo ko‘payadi.','Tabiatda hech qanday o‘zgarish bo‘lmaydi.'],a:0,e:'Quyonlar ko‘p o‘t yeydi, shuning uchun o‘tlar kamayadi.'}]);\nquiz($('q3'),[\n{q:'Quyon nimani yeydi?',o:['O‘t','Ilon','Tulki'],a:0,e:'Quyon o‘simlikxo‘r hayvon.'},\n{q:'Qaysi organizm ishlab chiqaruvchi?',o:['Quyon','Tulki','O‘t'],a:2,e:'O‘simliklar Quyosh nuri bilan o‘zi oziq hosil qiladi.'},\n{q:'Oziq to‘ri nimadan hosil bo‘ladi?',o:['Faqat bitta organizmdan','Bir nechta oziq zanjirlarining o‘zaro bog‘lanishidan','Faqat hayvonlardan'],a:1,e:'Zanjirlar kesishib, to‘r hosil qiladi.'}]);\nquiz($('qf'),[\n{q:'Oziq zanjiri nima?',o:['Hayvonlarning uyalari','Organizmlarning oziqlanish orqali bog‘lanish ketma-ketligi','Faqat o‘simliklar to‘plami'],a:1},\n{q:'Oziq zanjirida o‘simliklarning qanday o‘rni bor?',o:['Ishlab chiqaruvchi — zanjirning boshi','Yirtqich','Zanjirda qatnashmaydi'],a:0},\n{q:'Oziq zanjiridagi organizmlar qanday bog‘langan?',o:['Hech qanday bog‘lanmagan','Faqat rangi bilan','Oziqlanish orqali: kim kimni yeydi'],a:2},\n{q:'Oziq to‘ri nima?',o:['Bitta zanjirning o‘zi','Bir nechta oziq zanjirlarining o‘zaro bog‘lanishi','Baliqchilar to‘ri'],a:1},\n{q:'Bir organizm sonining keskin o‘zgarishi boshqa organizmlarga ta’sir qilishi mumkinmi?',o:['Yo‘q, hech qachon','Faqat o‘simliklarga','Ha, ta’sir qilishi mumkin'],a: x;margin:18px 0;box-shadow:0 4px 18px #0e9f8e22}\nh2{margin-top:0;color:var(--teal)}h3{color:var(--sky)}\n.box{background:#fff8e1;border-left:6px solid var(--sun);padding:10px 14px;border-radius:10px;margin:10px 0}\n.ways{display:flex;flex-wrap:wrap;gap:8px}\n.ways span{background:#e8f4fd;padding:6px 12px;border-radius:16px;font-weight:600}\nbutton{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:10px 16px;font-weight:700;color:#fff;background:var(--sky);transition:transform .15s,filter .15s}\nbutton:hover{filter:brightness(1.1);transform:translateY(-2px)}button:active{transform:scale(.95)}\nbutton:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n.b-c{background:var(--coral)}.b-g{background:var(--lime)}.b-t{background:var(--teal)}.b-o{background:#f39c12}.b-x{background:#8895a0}\n.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.scene{position:relative;height:260px;background:linear-gradient(#dff1fb 70%,#cfe8c9 70%);border-radius:16px;overflow:hidden;border:2px solid #cfe6ee}\n.person{position:absolute;bottom:34px;width:84px;text-align:center;transition:transform .3s}\n.person svg{width:84px;height:130px}\n.person small{display:block;font-weight:700;font-size:.72rem;background:#fffc;border-radius:8px;padding:1px 4px}\n.mask{position:absolute;left:50%;top:21px;transform:translateX(-50%);font-size:1.3rem;display:none}\n.on .mask{display:block}\n#door{position:absolute;left:45%;bottom:34px;width:46px;height:140px;background:#b07b4a;border-radius:6px 6px 0 0;border:3px solid #7d5230}\n#knob{position:absolute;right:5px;top:68px;width:12px;height:12px;border-radius:50%;background:#ffd24d;transition:background .3s,box-shadow .3s}\n.dot{position:absolute;width:9px;height:9px;border-radius:50%;background:#7b2fbe;pointer-events:none;z-index:5}\n.dot.food{background:#a0522d}.dot.good{background:#2ecc71}\n#sceneMsg,.msg{min-height:48px;background:#eef7f5;border-radius:12px;padding:10px 14px;margin-top:10px;font-weight:600}\n.q{background:#f5fbfa;border-radius:14px;padding:12px;margin-top:12px;border:2px dashed var(--teal)}\n.q ul{margin:6px 0;padding-left:20px}\n.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:600px){.cols{grid-template-columns:1fr}.person{width:64px}.person svg{width:64px;height:100px}#door{left:44%;width:36px}}\n.cols>div{border-radius:14px;padding:12px}\n.inf{background:#fde8e6}.non{background:#e6f4ea}\n.opts{display:flex;gap:10px;margin-top:10px}.opts button{flex:1}\n#sit{font-size:1.1rem;font-weight:700;min-height:56px}\n#badge{font-size:1.5rem;font-weight:800;text-align:center;min-height:50px}\n.pop{animation:pop .6s}\n@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}\n.shake{animation:shake .5s}\n@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}\n.shield{position:relative;max-width:420px;margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.shield button{background:#e4f3f0;color:var(--ink);border:2px solid var(--teal);font-size:.92rem}\n.shield button.act{background:var(--teal);color:#fff;transform:scale(1.05)}\n.sh{grid-column:1/3;text-align:center;font-size:4rem;line-height:1;transition:transform .4s}\n.body{display:flex;gap:14px;flex-wrap:wrap;align-items:stretch}\n.hum{flex:0 0 150px;background:#e8f4fd;border-radius:16px;position:relative;min-height:290px}\n.hum .zone{position:absolute;left:50%;transform:translateX(-50%);font-size:1.7rem;background:#fff;border:3px solid var(--sky);border-radius:50%;width:48px;height:48px;padding:0;color:inherit}\n.hum .zone.act{border-color:var(--coral);background:#ffe9e7}\n.bar{height:16px;background:#dde;border-radius:8px;overflow:hidden;margin:6px 0}\n.bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .6s}\nfooter{text-align:center;padding:20px;color:#58707a;font-size:.9rem}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<header><h1>🦠 KASALLIKLAR<\/h1><p>6-sinf «Tabiiy fanlar» — interaktiv dars-simulyatsiya<\/p><\/header>\n<nav><a href=\"#b1\">1. Yuqumli kasalliklar<\/a><a href=\"#b2\">2. Turlari va oldini olish<\/a><a href=\"#b3\">3. Himoya mexanizmi<\/a><\/nav>\n<main>\n\n<!-- 1-BO'LIM -->\n<section id=\"b1\">\n<h2>1. Yuqumli kasalliklar<\/h2>\n<h3>Yuqumli kasallik nima?<\/h3>\n<p>Yuqumli kasalliklar kasallik qo‘zg‘atuvchi mikroorganizmlar — <b>viruslar, bakteriyalar, ayrim zamburug‘lar va parazitlar<\/b> ta’sirida yuzaga keladi. Ular bir odamdan boshqasiga o‘tishi mumkin.<\/p>\n<div class=\"box\"><b>Qo‘zg‘atuvchilar qanday tarqaladi?<\/b><\/div>\n<div class=\"ways\"><span>🌬 Havo-tomchi yo‘li<\/span><span>🧤 Iflos qo‘l va buyumlar<\/span><span>🍲 Oziq-ovqat va suv<\/span><span>🦟 Ayrim hollarda hasharotlar<\/span><\/div>\n\n<h3>Tajriba: Odamdan odamga kasallik qanday tarqaladi?<\/h3>\n<p>Tugmalarni bosing va kuzating. Avval himoyasiz, keyin «Himoyalanish»ni yoqib solishtiring.<\/p>\n<div class=\"ctrl\">\n<button class=\"b-c\" id=\"bCough\">🤧 Yo‘talish<\/button>\n<button class=\"b-o\" id=\"bHand\">🖐 Qo‘l orqali<\/button>\n<button class=\"b-t\" id=\"bFood\">🥤 Oziq-ovqat/suv orqali<\/button>\n<button class=\"b-g\" id=\"bProt\">🛡 Himoyalanish: o‘chiq<\/button>\n<button class=\"b-x\" id=\"bReset\">↺ Qaytadan<\/button>\n<\/div>\n<div class=\"scene\" id=\"scene\">\n<div id=\"door\"><div id=\"knob\"><\/div><\/div>\n<div class=\"person\" id=\"p1\" style=\"left:3%\"><svg viewBox=\"0 0 84 130\"><circle cx=\"42\" cy=\"22\" r=\"17\" fill=\"#f6c9a0\"/><rect x=\"20\" y=\"42\" width=\"44\" height=\"52\" rx=\"14\" fill=\"#e45b5b\"/><rect x=\"26\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><rect x=\"46\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><circle cx=\"36\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><\/svg><span class=\"mask\">😷<\/span><small id=\"s1\">Tashuvchi 🤒<\/small><\/div>\n<div class=\"person\" id=\"p2\" style=\"left:57%\"><svg viewBox=\"0 0 84 130\"><circle cx=\"42\" cy=\"22\" r=\"17\" fill=\"#f6c9a0\"/><rect x=\"20\" y=\"42\" width=\"44\" height=\"52\" rx=\"14\" fill=\"#3b9ae1\"/><rect x=\"26\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><rect x=\"46\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><circle cx=\"36\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><\/svg><span class=\"mask\">😷<\/span><small id=\"s2\">Sog‘lom 🙂<\/small><\/div>\n<div class=\"person\" id=\"p3\" style=\"left:80%\"><svg viewBox=\"0 0 84 130\"><circle cx=\"42\" cy=\"22\" r=\"17\" fill=\"#f6c9a0\"/><rect x=\"20\" y=\"42\" width=\"44\" height=\"52\" rx=\"14\" fill=\"#7ac74f\"/><rect x=\"26\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><rect x=\"46\" y=\"92\" width=\"12\" height=\"36\" rx=\"5\" fill=\"#455a64\"/><circle cx=\"36\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><circle cx=\"48\" cy=\"20\" r=\"2.5\" fill=\"#222\"/><\/svg><small id=\"s3\">Sog‘lom 🙂<\/small><\/div>\n<\/div>\n<div id=\"sceneMsg\">Tugmalardan birini bosing 👆<\/div>\n<div class=\"bar\" title=\"Tarqalish darajasi\"><i id=\"risk\"><\/i><\/div>\n<small>Tarqalish xavfi darajasi<\/small>\n<div class=\"q\"><b>❓ Kasallik tarqalishini kamaytirish uchun nima qilish kerak?<\/b>\n<ul><li>Qo‘lni sovun bilan tez-tez yuvish;<\/li><li>yo‘talganda og‘iz-burunni yopish, kerak bo‘lsa niqob taqish;<\/li><li>xonani shamollatish;<\/li><li>toza suv ichish va xavfsiz, yaxshi pishirilgan ovqat yeyish.<\/li><\/ul><\/div>\n<\/section>\n\n<!-- 2-BO'LIM -->\n<section id=\"b2\">\n<h2>2. Kasallik turlari va ularning oldini olish<\/h2>\n<div class=\"cols\">\n<div class=\"inf\"><h3>🦠 Yuqumli<\/h3><p>Mikroorganizmlar qo‘zg‘atadi va odamdan odamga o‘tishi mumkin.<\/p><p><b>Misollar:<\/b> gripp, ayrim respirator virusli infeksiyalar, qizamiq.<\/p><\/div>\n<div class=\"non\"><h3>❤️ Yuqumsiz<\/h3><p>Odamdan odamga yuqmaydi.<\/p><p><b>Misollar:<\/b> ayrim yurak-qon tomir kasalliklari, qandli diabet, jarohatlar, ayrim irsiy kasalliklar.<\/p><\/div>\n<\/div>\n<div class=\"box\"><b>Muhim:<\/b> yuqumsiz kasalliklarning hammasi «noto‘g‘ri yashash»dan kelib chiqmaydi. Ularga <b>irsiyat<\/b>, <b>atrof-muhit<\/b>, <b>turmush tarzi<\/b> va boshqa omillar ta’sir qiladi. Kasal bo‘lgan odam aybdor emas — unga yordam kerak.<\/div>\n\n<h3>🎮 «Kasallikni aniqla» o‘yini<\/h3>\n<div>Ball: <b id=\"score\">0<\/b> / <span id=\"tot\">0<\/span><\/div>\n<div id=\"sit\"><\/div>\n<div class=\"opts\"><button class=\"b-c\" data-a=\"1\">A) Yuqumli<\/button><button class=\"b-t\" data-a=\"0\">B) Yuqumsiz<\/button><\/div>\n<div id=\"badge\"><\/div>\n<div class=\"msg\" id=\"expl\">Savolga javob bering.<\/div>\n<div class=\"ctrl\"><button id=\"nextQ\" class=\"b-g\">Keyingi savol ▶<\/button><\/div>\n\n<h3>🛡 Sog‘lom hayot qalqoni<\/h3>\n<p>Tugmani bosing — uning ahamiyatini bilib oling.<\/p>\n<div class=\"shield\" id=\"shield\"><div class=\"sh\" id=\"shBig\">🛡<\/div><\/div>\n<div class=\"msg\" id=\"shMsg\">Qalqon atrofidagi tugmalardan birini tanlang.<\/div>\n<\/section>\n\n<!-- 3-BO'LIM -->\n<section id=\"b3\">\n<h2>3. Insonning himoya mexanizmi<\/h2>\n<p>Organizmimiz mikroblarga qarshi bir necha «qal’a devori»ga ega. Tananing joyini bosing.<\/p>\n<div class=\"body\">\n<div class=\"hum\" id=\"hum\">\n<button class=\"zone\" style=\"top:8px\" data-k=\"0\" title=\"Burun\">👃<\/button>\n<button class=\"zone\" style=\"top:70px\" data-k=\"1\" title=\"Teri\">🖐<\/button>\n<button class=\"zone\" style=\"top:132px\" data-k=\"2\" title=\"Qon\">🩸<\/button>\n<button class=\"zone\" style=\"top:194px\" data-k=\"3\" title=\"Immunitet\">🧬<\/button>\n<\/div>\n<div style=\"flex:1;min-width:220px\"><div class=\"msg\" id=\"defMsg\" style=\"min-height:120px\">Chap tomondagi belgilardan birini bosing.<\/div>\n<div class=\"ctrl\"><button class=\"b-c\" id=\"bMicro\">🦠 Mikrobni yuborish<\/button><\/div>\n<div class=\"bar\"><i id=\"defBar\"><\/i><\/div><small>Mikrob yo‘lidagi to‘siqlar<\/small><\/div>\n<\/div>\n<div class=\"box\">Emlash organizmni kasallikni <b>oldindan<\/b> «tanishtirish» orqali himoyalaydi. Shuning uchun emlash kalendariga rioya qilish muhim.<\/div>\n<\/section>\n<\/main>\n<footer>6-sinf «Tabiiy fanlar» • Kasalliklar mavzusi<\/footer>\n\n<script>\nconst $=id=>document.getElementById(id);\n/* ---------- 1-bo'lim ---------- */\nconst scene=$('scene');let prot=false,risk=0,busy=false,timers=[];\nconst setRisk=v=>{risk=Math.max(0,Math.min(100,v));$('risk').style.width=risk+'%';$('risk').style.background=risk>60?'#f2635a':risk>30?'#ffc43d':'#7ac74f'};\nconst msg=t=>$('sceneMsg').innerHTML=t;\nfunction pos(el,dx,dy){const a=el.getBoundingClientRect(),b=scene.getBoundingClientRect();return{x:a.left-b.left+(dx??a.width/2),y:a.top-b.top+(dy??a.height/2)}}\nfunction dot(from,to,cls,ms,fadeAt){const d=document.createElement('div');d.className='dot '+(cls||'');d.style.left=from.x+'px';d.style.top=from.y+'px';scene.appendChild(d);\n const jx=(Math.random()-.5)*30,jy=(Math.random()-.5)*50;const tx=(fadeAt?from.x+(to.x-from.x)*fadeAt:to.x)+jx-from.x,ty=to.y+jy-from.y;\n const an=d.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${tx}px,${ty}px)`,opacity:fadeAt?0:1}],{duration:ms,easing:'ease-out',fill:'forwards'});\n an.onfinish=()=>{if(!fadeAt)d.remove();else d.remove()};return d}\nfunction wait(ms){return new Promise(r=>timers.push(setTimeout(r,ms)))}\nfunction status(n,sick,txt){const s=$('s'+n);s.textContent=txt;if(sick)s.style.background='#ffd0cc'}\nfunction reset(){timers.forEach(clearTimeout);timers=[];scene.querySelectorAll('.dot').forEach(d=>d.remove());\n $('knob').style.background='#ffd24d';$('knob').style.boxShadow='none';\n status(1,0,'Tashuvchi 🤒');status(2,0,'Sog‘lom 🙂');status(3,0,'Sog‘lom 🙂');['s1','s2','s3'].forEach(i=>$(i).style.background='');\n setRisk(0);busy=false;msg('Tugmalardan birini bosing 👆')}\nfunction setProt(v){prot=v;$('bProt').textContent='🛡 Himoyalanish: '+(v?'yoqiq':'o‘chiq');\n ['p1','p2'].forEach(i=>$(i).classList.toggle('on',v));\n if(v){msg('🛡 Himoya yoqildi: niqob taqildi. Endi tajribalarni takrorlang va farqni kuzating.')}}\n$('bProt').onclick=()=>setProt(!prot);\n$('bReset').onclick=reset;\n$('bCough').onclick=async()=>{if(busy)return;busy=true;const a=pos($('p1'),60,30),b=pos($('p2'),20,30);\n msg('🤧 Birinchi odam yo‘taldi — havoda mayda zarrachalar paydo bo‘ldi...');$('p1').style.transform='rotate(8deg)';\n for(let i=0;i<22;i++){dot(a,b,'',1700,prot?.08:0);await wait(60)}\n $('p1').style.transform='';await wait(900);\n if(prot){msg('😷 Niqob zarrachalarning ko‘pini ushlab qoldi. Xona shamollatilsa, ular yanada tezroq tarqaladi. Tarqalish keskin kamaydi!');setRisk(risk+5)}\n else{msg('😷 Zarrachalar ikkinchi odamga yetib bordi. Havo-tomchi yo‘li bilan yuqish xavfi bor!');status(2,1,'Xavf ostida ⚠️');setRisk(risk+40)}\n busy=false};\n$('bHand').onclick=async()=>{if(busy)return;busy=true;const h=pos($('p1'),70,70),k=pos($('knob')),h2=pos($('p2'),10,70);\n if(prot){msg('🧼 Qo‘l yuvildi! Sovun mikroblarni yuvib tashladi.');for(let i=0;i<10;i++){dot(h,{x:h.x,y:h.y+60},'good',900,.9);await wait(80)}\n  await wait(900);msg('🧼 Qo‘l toza bo‘lgani uchun eshik tutqichiga mikrob o‘tmadi. Xavf kamaydi!');setRisk(risk-25)}\n else{msg('🖐 1-odam qo‘liga mikroorganizmlar tushdi...');for(let i=0;i<8;i++){dot({x:h.x,y:h.y-20},h,'',500);await wait(80)}\n  await wait(600);msg('🚪 U eshik tutqichiga tegdi — mikroblar tutqichda qoldi.');$('knob').style.background='#9b59b6';$('knob').style.boxShadow='0 0 10px 6px #9b59b688';\n  for(let i=0;i<8;i++){dot(h,k,'',700);await wait(70)}await wait(900);\n  msg('🤝 2-odam tutqichga tegdi — mikroblar uning qo‘liga o‘tdi. Qo‘l yuvilmasa, yuz yoki ovqatga tegib, organizmga kiradi!');\n  for(let i=0;i<8;i++){dot(k,h2,'',700);await wait(70)}status(2,1,'Qo‘lida mikrob ⚠️');setRisk(risk+35)}\n busy=false};\n$('bFood').onclick=async()=>{if(busy)return;busy=true;const f=pos($('p3'),-30,60),m=pos($('p3'),42,30);\n if(prot){msg('💧 Suv qaynatildi va yaxshilab yuvilgan, pishirilgan ovqat tanlandi. Mikroblar yo‘q!');for(let i=0;i<10;i++){dot({x:f.x-30,y:f.y},m,'good',900);await wait(80)}\n  await wait(900);status(3,0,'Sog‘lom 🙂');msg('✅ Xavfsiz suv va ovqat — kasallikdan saqlaydi.');setRisk(risk-20)}\n else{msg('🥤 Ifloslangan suv va yuvilmagan oziq-ovqat...');for(let i=0;i<14;i++){dot({x:f.x-30,y:f.y},m,'food',1100);await wait(80)}\n  await wait(1100);msg('🦠 Mikroblar og‘iz orqali organizmga kirdi — ichak infeksiyasi xavfi bor!');status(3,1,'Xavf ostida ⚠️');setRisk(risk+35)}\n busy=false};\n\n/* ---------- 2-bo'lim: o'yin ---------- */\nconst Q=[\n[\"Bir o‘quvchi shamollagan. U yo‘talmoqda va aksirmoqda.\",1,\"Shamollash va gripp mikroorganizmlar (viruslar) ta’sirida bo‘ladi va havo-tomchi yo‘li bilan tarqaladi.\"],\n[\"Qandli diabet\",0,\"Qandli diabet yuqumsiz kasallik. Uni mikrob qo‘zg‘atmaydi, odamdan odamga yuqmaydi.\"],\n[\"Jarohatlanish\",0,\"Jarohat — shikast. U yuqumsiz, ammo jarohatga mikrob tushmasligi uchun uni toza saqlash kerak.\"],\n[\"Qizamiq\",1,\"Qizamiq — virusli yuqumli kasallik. Emlash undan ishonchli himoya qiladi.\"],\n[\"Ayrim irsiy kasalliklar\",0,\"Irsiy kasalliklar ota-onadan genlar orqali o‘tadi, mikroblar qo‘zg‘atmaydi, shuning uchun yuqmaydi.\"],\n[\"Gripp\",1,\"Gripp — virus qo‘zg‘atadigan yuqumli kasallik.\"]];\nlet qi=-1,sc=0,tot=0,ans=true,cur;\nfunction nextQ(){qi=(qi+1)%Q.length;cur=Q[qi];ans=false;$('sit').textContent=cur[0];$('badge').textContent='';$('expl').textContent='Javobingizni tanlang: A yoki B.'}\ndocument.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;tot++;const ok=+b.dataset.a===cur[1];\n const bd=$('badge');bd.className='';void bd.offsetWidth;\n if(ok){sc++;bd.textContent='✅ To‘g‘ri!';bd.style.color='#1e9e5a';bd.className='pop'}else{bd.textContent='❌ Qaytadan o‘ylab ko‘r!';bd.style.color='#e04b42';bd.className='shake'}\n $('expl').textContent=(ok?'':'To‘g‘ri javob: '+(cur[1]?'Yuqumli. ':'Yuqumsiz. '))+cur[2];$('score').textContent=sc;$('tot').textContent=tot});\n$('nextQ').onclick=nextQ;nextQ();\n\n/* ---------- qalqon ---------- */\nconst S=[[\"🧼\",\"Qo‘lni to‘g‘ri yuvish\",\"Sovun bilan kamida 20 soniya yuving: kaft, barmoq orasi va tirnoq ostini ham. Ovqatdan oldin, ko‘chadan kelgach va hojatxonadan keyin yuving.\"],\n[\"🥗\",\"To‘g‘ri ovqatlanish\",\"Sabzavot, meva, go‘sht, sut mahsulotlari va non organizmga vitaminlar va energiya beradi, himoya kuchini oshiradi.\"],\n[\"💧\",\"Toza suv ichish\",\"Qaynatilgan yoki sifatli suv ichak infeksiyalaridan saqlaydi. Suv ayni paytda organizm ishlashi uchun zarur.\"],\n[\"🛌\",\"Yetarli dam olish\",\"Uyqu paytida organizm tiklanadi. Maktab o‘quvchilari uchun kechasi taxminan 9–10 soat uyqu tavsiya etiladi.\"],\n[\"🏃\",\"Jismoniy faollik\",\"Harakat yurak va mushaklarni mustahkamlaydi, kayfiyatni yaxshilaydi va ayrim yuqumsiz kasalliklar xavfini kamaytiradi.\"],\n[\"🌬\",\"Xonani shamollatish\",\"Toza havo xonadagi mikrob zarrachalarini kamaytiradi. Xonani kuniga bir necha marta ochib qo‘ying.\"],\n[\"🧹\",\"Tozalikni saqlash\",\"Toza kiyim, uy va o‘quv xonasi mikroblar ko‘payishiga yo‘l qo‘ymaydi. Eshik tutqichlari, stol-stullarni artib turing.\"],\n[\"💉\",\"Emlashning ahamiyati\",\"Emlash organizmga kasallikni oldindan «o‘rgatadi». Qizamiq kabi xavfli infeksiyalardan himoya qiladi. Emlash kalendariga rioya qiling.\"]];\nS.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0]+' '+s[1];b.onclick=()=>{document.querySelectorAll('#shield button').forEach(x=>x.classList.remove('act'));b.classList.add('act');\n $('shMsg').innerHTML='<b>'+s[0]+' '+s[1]+'<\/b><br>'+s[2];const sh=$('shBig');sh.style.transform='scale(1.4) rotate(10deg)';setTimeout(()=>sh.style.transform='',350)};$('shield').appendChild(b)});\n\n/* ---------- 3-bo'lim ---------- */\nconst D=[[\"👃 Burun va nafas yo‘llari\",\"Burun va nafas yo‘llaridagi shilliq qavat va mayda tukchalar chang va mikroblarni ushlab qoladi. Aksirish va yo‘talish u const bar=document.getElementById('bar'),stage=document.getElementById('stage');
const frames=[],btns=[];
function show(i){
  btns.forEach((b,k)=>b.classList.toggle('on',k===i));
  frames.forEach((f,k)=>{
    if(k===i&&!f.dataset.loaded){f.srcdoc=PAGES[k].html;f.dataset.loaded=1}

  });
  try{location.hash=String(i+1)}catch(e){}
